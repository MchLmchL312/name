<!doctype html>
<html lang="nl">
<head>
  <link rel="icon" href="../../favicon.ico?v=3" sizes="any">
  <link rel="icon" href="../../favicon_MchL.png?v=3" type="image/png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Machiel van Soest — Skin-paintings</title>
  <link rel="stylesheet" href="../series-navigation.css?v=lightbox-1">
  <script type="module" src="../series-lightbox.js"></script>
</head>

<body>
  <header class="series-header">
    <div class="series-wrap topbar">
      <a class="series-back" href="../index.html#overzicht"><span aria-hidden="true">←</span> Terug naar serieoverzicht</a>
      <div class="series-identity">
        <div class="series-artist">Machiel van Soest</div>
        <h1 class="series-title">Skin-paintings</h1>
      </div>
      <nav class="series-tabs" aria-label="Serienavigatie">
        <a href="index.html" lang="nl" aria-current="page">Afbeeldingen</a>
        <a href="nl.html" lang="nl">Tekst NL</a>
        <a href="eng.html" lang="en">Text EN</a>
      </nav>
    </div>
  </header>

  <main class="series-wrap series-gallery" aria-label="Afbeeldingen">
    <div class="thumbs" id="thumbs"></div>
    <dialog class="lightbox" id="lightbox" aria-label="Grote weergave">
      <button class="lightbox-control lightbox-close" id="lightboxClose" type="button" aria-label="Sluiten" aria-keyshortcuts="Escape" autofocus>×</button>
      <button class="lightbox-control lightbox-prev" id="lightboxPrev" type="button" aria-label="Vorige afbeelding" aria-keyshortcuts="ArrowLeft">←</button>
      <img id="lightboxImg" alt="" />
      <button class="lightbox-control lightbox-next" id="lightboxNext" type="button" aria-label="Volgende afbeelding" aria-keyshortcuts="ArrowRight">→</button>
    </dialog>
  </main>

<script>
    // ===== Instellingen =====
    const IMAGE_COUNT = 55; // image_1.jpg ... image_55.jpg
    const images = Array.from({ length: IMAGE_COUNT }, (_, i) => `image_${i + 1}.jpg`);

    const thumbs = document.getElementById('thumbs');
    // Thumbnails
    images.forEach((src, i) => {
      const item = document.createElement('button');
      item.className = 'thumb';
      item.type = 'button';
      item.setAttribute('aria-label', `Open afbeelding ${i + 1}`);

      const im = new Image();
      im.src = src;
      im.alt = `Skin-paintings ${i + 1}`;
      im.loading = "lazy";
      item.appendChild(im);

      thumbs.appendChild(item);
    });
  </script>
</body>
</html>
