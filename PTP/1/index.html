<!doctype html>
<html lang="nl">
<head>
  <link rel="icon" href="../../favicon.ico?v=3" sizes="any">
  <link rel="icon" href="../../favicon_MchL.png?v=3" type="image/png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Machiel van Soest — Symbol</title>
  <link rel="stylesheet" href="../series-navigation.css?v=2b87dee">
</head>

<body>
  <header class="series-header">
    <div class="series-wrap topbar">
      <a class="series-back" href="../index.html#overzicht"><span aria-hidden="true">←</span> Terug naar serieoverzicht</a>
      <div class="series-identity">
        <div class="series-artist">Machiel van Soest</div>
        <h1 class="series-title">Symbol</h1>
      </div>
      <nav class="series-tabs" aria-label="Serienavigatie">
        <a href="index.html" lang="nl" aria-current="page">Afbeeldingen</a>
        <a href="nl.html" lang="nl">Tekst NL</a>
        <a href="eng.html" lang="en">Text EN</a>
      </nav>
    </div>
  </header>

  <main class="series-wrap series-gallery" aria-label="Afbeeldingen">
    <div class="thumbs" id="thumbs"></div>
    <dialog class="lightbox" id="lightbox" aria-label="Grote weergave">
      <button class="lightbox-close" id="lightboxClose" type="button" autofocus>Sluiten <span aria-hidden="true">×</span></button>
      <img id="lightboxImg" alt="" />
    </dialog>
  </main>

<script>
  // ===== Instellingen =====
  const IMAGE_MAX = 44;           // maximum waar hij tot mag proberen
  const STOP_AFTER_MISSES = 2;    // stop na X opeenvolgende missers (meestal genoeg als je reeks netjes 1..n is)

  const thumbs = document.getElementById('thumbs');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');

  function openLightbox(src, i){
    lightboxImg.src = src;
    lightboxImg.alt = `Symbol ${i}`;
    lightbox.showModal();
  }

  function closeLightbox(){
    lightbox.close();
  }

  function addThumb(src, i){
    const item = document.createElement('button');
    item.className = 'thumb';
    item.type = 'button';
    item.setAttribute('aria-label', `Open afbeelding ${i}`);

    const im = new Image();
    im.src = src;
    im.alt = `Symbol ${i}`;
    im.loading = "lazy";
    item.appendChild(im);

    const open = () => openLightbox(src, i);
    item.addEventListener('click', open);

    thumbs.appendChild(item);
  }

  // Probeert sequentieel te laden; alleen succesvolle loads worden toegevoegd.
  async function loadThumbs(){
    let misses = 0;

    for (let i = 1; i <= IMAGE_MAX; i++){
      const src = encodeURI(`image (${i}).jpg`);

      const exists = await new Promise((resolve) => {
        const probe = new Image();
        probe.onload = () => resolve(true);
        probe.onerror = () => resolve(false);
        probe.src = src;
      });

      if (!exists){
        misses++;
        if (misses >= STOP_AFTER_MISSES) break;
        continue;
      }

      misses = 0;
      addThumb(src, i);
    }
  }

  loadThumbs();

  // Klik op groot beeld -> sluiten
  lightboxImg.addEventListener('click', closeLightbox);
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
</script>
</body>
</html>
