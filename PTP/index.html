<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>PTP</title>
  <style>
    :root{
      --overlay-pad: clamp(12px, 2vw, 24px);
      --imgW: 2011;
      --imgH: 2048;
      --x1: 28%;
      --x2: 50%;
      --x3: 72%;
      --y1: 28%;
      --y2: 50%;
      --y3: 72%;
    }

    *{ box-sizing:border-box; }
    html, body{ margin:0; min-height:100%; }
    body{
      background:#000;
      color:#fff;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a{ color:inherit; }

    .hero{
      position:relative;
      min-height:100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:#000;
    }

    .overlay{
      position:absolute;
      top:0;
      left:0;
      right:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding: calc(env(safe-area-inset-top) + 12px) var(--overlay-pad) 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,.68), rgba(0,0,0,0));
      z-index:2;
    }

    .title{
      display:flex;
      align-items:baseline;
      gap:10px;
      line-height:1;
      text-shadow: 0 2px 12px rgba(0,0,0,.45);
    }

    .title strong{
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight:700;
    }

    .title span{
      font-size: clamp(.8rem, 1.4vw, .95rem);
      opacity:.88;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .overlay-link{
      text-decoration:none;
      font-size: clamp(.95rem, 1.4vw, 1rem);
      padding: 8px 0;
      text-shadow: 0 2px 12px rgba(0,0,0,.45);
    }

    .overlay-link:hover,
    .overlay-link:focus-visible{
      text-decoration:underline;
    }

    .stage{
      position:relative;
      width:min(100vw, calc(100svh * var(--imgW) / var(--imgH)));
      height:min(100svh, calc(100vw * var(--imgH) / var(--imgW)));
      background: url("PTP.jpg") center center / contain no-repeat;
    }

    .spot{
      position:absolute;
      width:18%;
      aspect-ratio:1 / 1;
      display:block;
      outline:none;
      background:rgba(255,255,255,0);
      -webkit-tap-highlight-color: rgba(255,255,255,.18);
    }

    .spot:hover,
    .spot:focus-visible{
      background:rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
      cursor:pointer;
    }

    .c{ transform: translate(-50%, -50%); }
    .s1{ left:var(--x1); top:var(--y1); }
    .s2{ left:var(--x2); top:var(--y1); }
    .s3{ left:var(--x3); top:var(--y1); }
    .s4{ left:var(--x1); top:var(--y2); }
    .s5{ left:var(--x2); top:var(--y2); }
    .s6{ left:var(--x3); top:var(--y2); }
    .s7{ left:var(--x1); top:var(--y3); }
    .s8{ left:var(--x2); top:var(--y3); }
    .s9{ left:var(--x3); top:var(--y3); }

    .installation{
      background:#000;
      padding: 0;
    }

    .installation img{
      display:block;
      width:100%;
      height:auto;
    }

    @media (max-width: 640px){
      .overlay{
        align-items:flex-start;
      }

      .title{
        flex-direction:column;
        align-items:flex-start;
        gap:4px;
      }
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="PTP beginscherm">
    <div class="overlay">
      <div class="title"><strong>Machiel van Soest</strong><span>PTP</span></div>
      <a class="overlay-link" href="#installatie">installatie</a>
    </div>

    <div class="stage" aria-label="PTP achtergrond met 9 hotspots">
      <a class="spot c s1" href="./1/index.html" aria-label="Werk 1"></a>
      <a class="spot c s2" href="./2/index.html" aria-label="Werk 2"></a>
      <a class="spot c s3" href="./3/index.html" aria-label="Werk 3"></a>
      <a class="spot c s4" href="./4/index.html" aria-label="Werk 4"></a>
      <a class="spot c s5" href="./5/index.html" aria-label="Werk 5"></a>
      <a class="spot c s6" href="./6/index.html" aria-label="Werk 6"></a>
      <a class="spot c s7" href="./7/index.html" aria-label="Werk 7"></a>
      <a class="spot c s8" href="./8/index.html" aria-label="Werk 8"></a>
      <a class="spot c s9" href="./9/index.html" aria-label="Werk 9"></a>
    </div>
  </section>

  <section class="installation" id="installatie" aria-label="Installatie">
    <img src="board1.jpg" alt="Installatie PTP" />
  </section>
</body>
</html>
