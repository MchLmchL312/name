<!doctype html> 
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>PTP</title>
    <style>
    :root{
      --maxw: 1200px;
      --pad: 18px;
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --bg: #111;
      --card: rgba(255,255,255,.03);

      /* PTP.jpg is 2011 × 2048 */
      --imgW: 2011;
      --imgH: 2048;
      --content-gap: clamp(16px, 3vw, 28px);
      --stage-fit-h: calc(100svh - 110px - (2 * var(--content-gap)));

      /* dit bepaalt het totale 3×3 blok */
      --x1: 28%;
      --x2: 50%;
      --x3: 72%;
      --y1: 28%;
      --y2: 50%;
      --y3: 72%;
    }

    *{ box-sizing:border-box; }
    html, body{ min-height:100%; margin:0; }

    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(255,255,255,.05), transparent 60%),
                  radial-gradient(900px 500px at 80% 10%, rgba(255,255,255,.04), transparent 55%),
                  var(--bg);
      color: var(--text);
    }

    header{
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      background: rgba(12,12,15,.78);
      border-bottom: 1px solid var(--border);
    }

    .wrap{
      width: 100%;
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 var(--pad);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 16px;
      padding: 14px 0;
    }

    .brand{
      display:flex;
      flex-direction:column;
      line-height:1.1;
      flex: 0 0 auto;
    }

    .brand .name{
      font-weight:650;
      letter-spacing:.2px;
      color: var(--text);
    }

    .brand .sub{
      font-size:13px;
      color: var(--muted);
      margin-top:2px;
    }

    nav{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap:wrap;
    }

    nav a{
      color: var(--text);
      text-decoration:none;
      font-size:14px;
      padding: 8px 10px;
      border-radius:10px;
      border:1px solid transparent;
      white-space:nowrap;
    }

    nav a:hover,
    nav a:focus-visible{
      border-color: var(--border);
      background: rgba(255,255,255,.04);
      outline: none;
    }

    nav a.active{
      border-color: rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
    }

    main.content{
      flex:1;
      width:100%;
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 18px var(--pad) 40px;
      display:grid;
      gap: var(--content-gap);
    }

    .wrap-stage{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .stage{
      position:relative;
      width:min(100%, calc(var(--stage-fit-h) * var(--imgW) / var(--imgH)));
      aspect-ratio: var(--imgW) / var(--imgH);
      max-height: var(--stage-fit-h);
      border-radius: 18px;
      overflow:hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      background:#000;
    }

    .stage-image,
    .install-image{
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
    }

    .install-panel{
      width:100%;
      border-radius:18px;
      overflow:hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      background:#000;
    }

    .install-image{
      height:auto;
      max-height:none;
    }

    .spot{
      position:absolute;
      width:18%;
      aspect-ratio: 1 / 1;
      display:block;
      border-radius:14px;
      outline:none;
      background:rgba(255,255,255,0);
      -webkit-tap-highlight-color: rgba(255,255,255,.18);
    }

    .spot::after{
      content: attr(data-label);
      position:absolute;
      left:50%;
      bottom:8px;
      transform:translateX(-50%);
      max-width:calc(100% - 12px);
      padding:5px 7px;
      border:1px solid rgba(255,255,255,.16);
      border-radius:999px;
      background:rgba(12,12,15,.58);
      color:rgba(255,255,255,.72);
      font-size:clamp(10px, 1.3vw, 12px);
      line-height:1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      opacity:.72;
      transition:opacity 140ms ease, background 140ms ease, color 140ms ease;
    }

    .spot:hover,
    .spot:focus-visible{
      background:rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
      cursor:pointer;
    }

    .spot:hover::after,
    .spot:focus-visible::after{
      opacity:1;
      background:rgba(12,12,15,.78);
      color:rgba(255,255,255,.95);
    }

    .c{ transform: translate(-50%, -50%); }
    .s1{ left:var(--x1); top:var(--y1); }
    .s2{ left:var(--x2); top:var(--y1); }
    .s3{ left:var(--x3); top:var(--y1); }
    .s4{ left:var(--x1); top:var(--y2); }
    .s5{ left:var(--x2); top:var(--y2); }
    .s6{ left:var(--x3); top:var(--y2); }
    .s7{ left:var(--x1); top:var(--y3); }
    .s8{ left:var(--x2); top:var(--y3); }
    .s9{ left:var(--x3); top:var(--y3); }

    @media (max-width: 900px){
      :root{
        --stage-fit-h: calc(100svh - 150px - (2 * var(--content-gap)));
      }
    }

    @media (max-width: 720px){
      .topbar{
        align-items:flex-start;
      }

      .spot::after{
        bottom:6px;
        padding:4px 6px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <div class="name">Machiel van Soest</div>
          <div class="sub">PTP</div>
        </div>

        <nav aria-label="Navigatie">
          <a class="active" href="index.html">PTP</a>
          <a href="#installatie">Installatie</a>
          <a href="./1/index.html">Symbol</a>
          <a href="./2/index.html">Flag</a>
          <a href="./3/index.html">Text</a>
          <a href="./4/index.html">Internal</a>
          <a href="./5/index.html">Skin</a>
          <a href="./6/index.html">Noise</a>
          <a href="./7/index.html">PTP</a>
          <a href="./8/index.html">Ready Made</a>
          <a href="./9/index.html">Outside</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="content">
    <div id="overzicht" class="wrap-stage">
      <div class="stage" aria-label="PTP achtergrond met 9 hotspots">
        <img class="stage-image" src="PTP.jpg" alt="PTP overzicht" />
        <a class="spot c s1" href="./1/index.html" data-label="Symbol" aria-label="Werk 1: Symbol"></a>
        <a class="spot c s2" href="./2/index.html" data-label="Flag" aria-label="Werk 2: Flag"></a>
        <a class="spot c s3" href="./3/index.html" data-label="Text" aria-label="Werk 3: Text"></a>
        <a class="spot c s4" href="./4/index.html" data-label="Internal" aria-label="Werk 4: Internal"></a>
        <a class="spot c s5" href="./5/index.html" data-label="Skin" aria-label="Werk 5: Skin-paintings"></a>
        <a class="spot c s6" href="./6/index.html" data-label="Noise" aria-label="Werk 6: Noise"></a>
        <a class="spot c s7" href="./7/index.html" data-label="PTP" aria-label="Werk 7: PTP"></a>
        <a class="spot c s8" href="./8/index.html" data-label="Ready" aria-label="Werk 8: Ready Made"></a>
        <a class="spot c s9" href="./9/index.html" data-label="Outside" aria-label="Werk 9: Outside"></a>
      </div>
    </div>

    <div id="installatie" class="install-panel">
      <img class="install-image" src="installatie.jpg" alt="PTP installatie" />
    </div>
  </main>
</body>
</html>
