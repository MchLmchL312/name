<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>PTP</title>
  <style>
    :root{
      --header-h: 64px;
      --page-pad: clamp(12px, 2vw, 24px);
      --content-gap: clamp(16px, 3vw, 28px);
      /* PTP.jpg is 2011 × 2048 */
      --imgW: 2011;
      --imgH: 2048;

      /* dit bepaalt het totale 3×3 blok: verder uit elkaar = groter blok */
      --x1: 28%;
      --x2: 50%;
      --x3: 72%;

      --y1: 28%;
      --y2: 50%;
      --y3: 72%;
    }

    *{ box-sizing:border-box; }
    html, body{ min-height:100%; margin:0; }
    body{
      background:#111;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:#eee;
    }

    .page{
      min-height:100vh;
      padding-top: calc(var(--header-h) + env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    .header{
      position:sticky;
      top:0;
      left:0;
      right:0;
      min-height: calc(var(--header-h) + env(safe-area-inset-top));
      padding: calc(10px + env(safe-area-inset-top)) var(--page-pad) 10px;
      background:rgba(0,0,0,.92);
      backdrop-filter: blur(10px);
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      color:#fff;
      z-index:1000;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .name{
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight:700;
      line-height:1.1;
    }
    .name .sub{
      display:block;
      font-size:0.78rem;
      font-weight:400;
      opacity:0.82;
      margin-top:4px;
      letter-spacing:0.02em;
    }

    .content{
      width:min(100%, 1200px);
      margin:0 auto;
      padding: var(--content-gap) var(--page-pad) 0;
      display:grid;
      gap: var(--content-gap);
    }

    .intro{
      margin:0;
      color:rgba(255,255,255,.72);
      font-size:0.98rem;
      line-height:1.6;
      max-width:64ch;
    }

    .wrap{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .stage{
      position:relative;
      width:min(100%, calc((100svh - var(--header-h) - 120px) * var(--imgW) / var(--imgH)));
      aspect-ratio: var(--imgW) / var(--imgH);
      max-height: calc(100svh - var(--header-h) - 120px);
      background: url("PTP.jpg") center center / contain no-repeat;
      border-radius: 18px;
      overflow:hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    .spot{
      position:absolute;
      width:18%;
      aspect-ratio: 1 / 1;
      display:block;
      border-radius:14px;
      outline:none;
      background:rgba(255,255,255,0);
      -webkit-tap-highlight-color: rgba(255,255,255,.18);
    }

    .spot:hover,
    .spot:focus-visible{
      background:rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
      cursor:pointer;
    }

    .c{ transform: translate(-50%, -50%); }

    .s1{ left:var(--x1); top:var(--y1); }
    .s2{ left:var(--x2); top:var(--y1); }
    .s3{ left:var(--x3); top:var(--y1); }
    .s4{ left:var(--x1); top:var(--y2); }
    .s5{ left:var(--x2); top:var(--y2); }
    .s6{ left:var(--x3); top:var(--y2); }
    .s7{ left:var(--x1); top:var(--y3); }
    .s8{ left:var(--x2); top:var(--y3); }
    .s9{ left:var(--x3); top:var(--y3); }

    .mobile-nav{
      display:none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:12px;
    }

    .mobile-link{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:54px;
      padding:14px 16px;
      border-radius:14px;
      text-decoration:none;
      color:#fff;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.12);
      font-weight:600;
      text-align:center;
      transition: background .2s ease, transform .2s ease, border-color .2s ease;
      -webkit-tap-highlight-color: rgba(255,255,255,.18);
    }

    .mobile-link:hover,
    .mobile-link:focus-visible{
      background:rgba(255,255,255,.1);
      border-color:rgba(255,255,255,.22);
      transform:translateY(-1px);
    }

    @media (max-width: 900px){
      :root{
        --header-h: 60px;
      }

      .content{
        padding-top: 18px;
      }

      .stage{
        width:min(100%, 680px);
        max-height:none;
      }
    }

    @media (max-width: 700px){
      .header{
        align-items:flex-start;
      }

      .intro{
        font-size:0.94rem;
      }

      .stage{
        display:none;
      }

      .mobile-nav{
        display:grid;
      }
    }

    @media (max-width: 420px){
      .mobile-nav{
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="header">
      <div class="name">Machiel van Soest<span class="sub">PTP</span></div>
    </div>

    <main class="content">
      <p class="intro">Kies een werk uit het overzicht. Alle links openen nu in hetzelfde venster, zodat de navigatie ook op iPhone en andere mobiele telefoons zonder pop-ups of nieuwe tabs werkt.</p>

      <div class="wrap">
        <div class="stage" aria-label="PTP achtergrond met 9 hotspots">
          <a class="spot c s1" href="./1/index.html" aria-label="Werk 1"></a>
          <a class="spot c s2" href="./2/index.html" aria-label="Werk 2"></a>
          <a class="spot c s3" href="./3/index.html" aria-label="Werk 3"></a>
          <a class="spot c s4" href="./4/index.html" aria-label="Werk 4"></a>
          <a class="spot c s5" href="./5/index.html" aria-label="Werk 5"></a>
          <a class="spot c s6" href="./6/index.html" aria-label="Werk 6"></a>
          <a class="spot c s7" href="./7/index.html" aria-label="Werk 7"></a>
          <a class="spot c s8" href="./8/index.html" aria-label="Werk 8"></a>
          <a class="spot c s9" href="./9/index.html" aria-label="Werk 9"></a>
        </div>
      </div>

      <nav class="mobile-nav" aria-label="Mobiele navigatie naar de werken">
        <a class="mobile-link" href="./1/index.html">Werk 1</a>
        <a class="mobile-link" href="./2/index.html">Werk 2</a>
        <a class="mobile-link" href="./3/index.html">Werk 3</a>
        <a class="mobile-link" href="./4/index.html">Werk 4</a>
        <a class="mobile-link" href="./5/index.html">Werk 5</a>
        <a class="mobile-link" href="./6/index.html">Werk 6</a>
        <a class="mobile-link" href="./7/index.html">Werk 7</a>
        <a class="mobile-link" href="./8/index.html">Werk 8</a>
        <a class="mobile-link" href="./9/index.html">Werk 9</a>
      </nav>
    </main>
  </div>
</body>
</html>
