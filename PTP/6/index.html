<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Machiel van Soest — Noise</title>
  <style>
    :root{
      --maxw: 1100px;
      --pad: 18px;
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --bg: #0c0c0f;
      --card: rgba(255,255,255,.03);
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(255,255,255,.06), transparent 60%),
                  radial-gradient(900px 500px at 80% 10%, rgba(255,255,255,.05), transparent 55%),
                  var(--bg);
      color: var(--text);
    }

    header{
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(12,12,15,.65);
      border-bottom: 1px solid var(--border);
    }

    .wrap{
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 var(--pad);
      width: 100%;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 16px;
      padding: 14px 0;
    }

    .brand{
      display:flex;
      flex-direction:column;
      line-height:1.1;
    }
    .brand .name{
      font-weight: 650;
      letter-spacing: .2px;
    }
    .brand .sub{
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    nav{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
    }
    nav a{
      color: var(--text);
      text-decoration:none;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
    }
    nav a:hover{
      border-color: var(--border);
      background: rgba(255,255,255,.04);
    }

    main{
      flex: 1;
      display:flex;
      padding: 18px 0 40px;
      min-height: 0;
    }

    .card{
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      overflow: hidden;
      display:flex;
      flex-direction:column;
      min-height: 0;
    }

    .center{
      padding: 64px 18px 72px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 18px;
      text-align:center;
    }

    .hint{
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      max-width: 70ch;
      margin: 0 auto;
    }

    .actions{
      display:flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content:center;
      margin-top: 2px;
    }

    .btn{
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-size: 18px;
      padding: 14px 18px;
      border-radius: 16px;
      cursor: pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width: 200px;
      gap: 8px;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      white-space: nowrap;
    }
    .btn:hover{
      background: rgba(255,255,255,.09);
      border-color: rgba(255,255,255,.24);
      transform: translateY(-1px);
    }
    .btn:active{ transform: translateY(0px); }

    .btn.primary{
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.28);
    }

    @media (max-width: 720px){
      .topbar{ align-items:flex-start; }
      .center{ padding: 52px 14px 60px; }
      .btn{ min-width: 160px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <div class="name">Machiel van Soest</div>
          <div class="sub">Noise</div>
        </div>

        <nav aria-label="Hoofdnavigatie">
          <a href="../index.html">PTP</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="card" aria-label="Landing">
        <div class="center">
          <div class="hint"></div>

          <div class="actions" aria-label="Keuze">
            <a class="btn primary" href="index1.html" aria-label="Ga naar werk">Werk</a>
            <a class="btn" href="nl.html" aria-label="Ga naar tekst">Toelichting</a>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
