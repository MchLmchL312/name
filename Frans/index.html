<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frans oefenen :3</title>
  <style>
    :root {
      --bg: #fff5f8;
      --card: #ffffff;
      --ink: #342035;
      --muted: #725d72;
      --pink: #d91d73;
      --pink-dark: #b9145c;
      --pink-soft: #ffe4f0;
      --blue: #2453a6;
      --blue-soft: #e8f0ff;
      --red: #d9324a;
      --red-soft: #ffe8ed;
      --green: #0f8b57;
      --green-soft: #e9fff5;
      --gold: #ffbd42;
      --shadow: 0 18px 45px rgba(217, 29, 115, 0.16);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
      background:
        radial-gradient(circle at 16% 10%, rgba(255, 203, 226, 0.92), transparent 30%),
        radial-gradient(circle at 88% 18%, rgba(232, 240, 255, 0.96), transparent 28%),
        linear-gradient(135deg, #fff9fb 0%, #ffe0ee 48%, #eff5ff 100%);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .title-wrap {
      position: relative;
      min-width: 0;
    }

    .france-mark {
      width: min(360px, 70vw);
      height: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      overflow: hidden;
      border-radius: 999px;
      box-shadow: 0 10px 22px rgba(36, 83, 166, 0.12);
      margin-bottom: 10px;
    }

    .france-mark span:nth-child(1) { background: var(--blue); }
    .france-mark span:nth-child(2) { background: #fff; }
    .france-mark span:nth-child(3) { background: var(--red); }

    h1 {
      margin: 0;
      color: var(--pink);
      font-size: clamp(2.3rem, 7vw, 5.2rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.2rem);
    }

    .tabs,
    .actions,
    .learn-actions,
    .direction-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tabs {
      justify-content: flex-end;
    }

    .button {
      min-height: 44px;
      border: 0;
      border-radius: var(--radius);
      padding: 11px 16px;
      color: #fff;
      background: var(--pink);
      box-shadow: 0 10px 22px rgba(217, 29, 115, 0.22);
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
      white-space: nowrap;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(217, 29, 115, 0.28);
      background: var(--pink-dark);
    }

    .button.secondary {
      color: var(--pink);
      background: #fff;
      box-shadow: 0 8px 18px rgba(217, 29, 115, 0.13);
    }

    .button.blue {
      color: var(--blue);
      background: #fff;
      box-shadow: 0 8px 18px rgba(36, 83, 166, 0.13);
    }

    .button.active {
      color: #fff;
      background: var(--pink-dark);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .panel,
    .stat,
    .feedback,
    .word-row {
      border: 1px solid rgba(217, 29, 115, 0.14);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 8px 24px rgba(217, 29, 115, 0.08);
    }

    .panel {
      padding: clamp(16px, 3vw, 28px);
      box-shadow: var(--shadow);
    }

    .learn-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(280px, 1.25fr);
      gap: 16px;
      align-items: start;
    }

    .flashcard {
      position: relative;
      display: grid;
      gap: 14px;
      text-align: center;
      overflow: hidden;
    }

    .flashcard::after {
      content: "";
      position: absolute;
      right: 18px;
      bottom: 16px;
      width: 90px;
      height: 120px;
      opacity: 0.12;
      background:
        linear-gradient(76deg, transparent 40%, var(--blue) 41% 48%, transparent 49%),
        linear-gradient(104deg, transparent 40%, var(--red) 41% 48%, transparent 49%),
        linear-gradient(90deg, transparent 47%, var(--ink) 48% 52%, transparent 53%),
        linear-gradient(0deg, transparent 12%, var(--ink) 13% 17%, transparent 18%);
      pointer-events: none;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      justify-self: center;
      min-height: 28px;
      border-radius: 999px;
      padding: 5px 12px;
      color: var(--pink);
      background: var(--pink-soft);
      font-size: 0.82rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .word-big {
      min-height: 140px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      padding: 18px;
      color: var(--pink);
      background:
        linear-gradient(90deg, rgba(36, 83, 166, 0.08), transparent 28%, transparent 72%, rgba(217, 50, 74, 0.08)),
        linear-gradient(180deg, #fff 0%, var(--pink-soft) 100%);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 8vw, 5.2rem);
      font-weight: 900;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .answer-big {
      min-height: 72px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      padding: 14px;
      color: var(--ink);
      background: #fff;
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .learn-actions {
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 12px;
    }

    .search,
    .select {
      width: 100%;
      min-height: 44px;
      border: 2px solid rgba(217, 29, 115, 0.22);
      border-radius: var(--radius);
      padding: 10px 12px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    .word-list {
      display: grid;
      gap: 8px;
      max-height: 560px;
      overflow: auto;
      padding-right: 4px;
    }

    .word-row {
      display: grid;
      grid-template-columns: minmax(120px, 0.8fr) minmax(0, 1.2fr);
      gap: 10px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
    }

    .word-row:hover {
      border-color: rgba(217, 29, 115, 0.32);
      background: #fff;
    }

    .row-french {
      color: var(--pink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
      font-weight: 900;
    }

    .row-dutch {
      color: var(--ink);
      font-weight: 800;
    }

    .row-cat {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      min-height: 74px;
      padding: 12px;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .stat-value {
      display: block;
      margin-top: 6px;
      color: var(--pink);
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 900;
    }

    .quiz-card {
      display: grid;
      gap: 16px;
      text-align: center;
    }

    .direction-tabs {
      justify-content: center;
    }

    .prompt-label {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .answer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .answer {
      width: 100%;
      min-height: 56px;
      border: 2px solid rgba(217, 29, 115, 0.22);
      border-radius: var(--radius);
      padding: 12px 14px;
      color: var(--ink);
      background: #fff;
      font-size: clamp(1.05rem, 2.8vw, 1.35rem);
      outline: none;
      transition: border 150ms ease, box-shadow 150ms ease;
    }

    .answer:focus,
    .search:focus,
    .select:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(217, 29, 115, 0.12);
    }

    .feedback {
      min-height: 80px;
      margin-top: 12px;
      padding: 14px 16px;
      display: grid;
      align-content: center;
      gap: 4px;
      text-align: center;
    }

    .feedback-title {
      margin: 0;
      color: var(--pink);
      font-size: 1.25rem;
      font-weight: 900;
    }

    .feedback-text {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .feedback.good {
      background: var(--green-soft);
      border-color: rgba(15, 139, 87, 0.28);
    }

    .feedback.good .feedback-title {
      color: var(--green);
    }

    .feedback.try {
      background: var(--red-soft);
      border-color: rgba(217, 50, 74, 0.24);
    }

    .feedback.try .feedback-title {
      color: var(--red);
    }

    .actions {
      justify-content: center;
      margin-top: 12px;
    }

    @media (max-width: 850px) {
      .topbar,
      .learn-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .tabs,
      .topbar .button,
      .learn-actions .button,
      .actions .button,
      .direction-tabs .button {
        width: 100%;
      }

      .dashboard {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filters,
      .answer-row,
      .word-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar" aria-label="Titel">
      <div class="title-wrap">
        <div class="france-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <h1>Frans oefenen :3</h1>
        <p class="subtitle">Eerst leren, daarna overhoren. Frans naar Nederlands en Nederlands naar Frans.</p>
      </div>
      <div class="tabs" role="tablist" aria-label="Spelstand">
        <button class="button active" id="learnTab" type="button">1. Leren</button>
        <button class="button secondary" id="quizTab" type="button">2. Overhoren</button>
      </div>
    </section>

    <section class="screen active" id="learnScreen" aria-label="Leren">
      <div class="learn-grid">
        <section class="panel flashcard" aria-label="Leerkaart">
          <span class="tag" id="learnCategory">woord</span>
          <div class="word-big" id="learnFrench">...</div>
          <div class="answer-big" id="learnDutch">...</div>
          <div class="learn-actions">
            <button class="button secondary" id="prevCard" type="button">Vorige</button>
            <button class="button" id="flipCard" type="button">Draai om</button>
            <button class="button" id="nextCard" type="button">Volgende</button>
            <button class="button secondary" id="shuffleLearn" type="button">Hussel</button>
          </div>
        </section>

        <section class="panel" aria-label="Woordenlijst">
          <div class="filters">
            <input class="search" id="search" type="search" placeholder="Zoek Frans of Nederlands">
            <select class="select" id="categoryFilter" aria-label="Categorie">
              <option value="all">Alle woorden</option>
            </select>
          </div>
          <div class="word-list" id="wordList"></div>
        </section>
      </div>
    </section>

    <section class="screen" id="quizScreen" aria-label="Overhoren">
      <section class="dashboard" aria-label="Score">
        <div class="stat">
          <span class="stat-label">Goed</span>
          <span class="stat-value" id="correct">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Pogingen</span>
          <span class="stat-value" id="tries">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Streak</span>
          <span class="stat-value" id="streak">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Sterren</span>
          <span class="stat-value" id="stars">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Woorden</span>
          <span class="stat-value" id="totalWords">0</span>
        </div>
      </section>

      <section class="panel quiz-card" aria-label="Oefenvraag">
        <div class="direction-tabs" aria-label="Richting">
          <button class="button active" id="frToNl" type="button">Frans naar Nederlands</button>
          <button class="button blue" id="nlToFr" type="button">Nederlands naar Frans</button>
          <button class="button secondary" id="mixedMode" type="button">Door elkaar</button>
        </div>
        <p class="prompt-label" id="quizCategory">Vertaal naar het Nederlands</p>
        <div class="word-big" id="quizPrompt">...</div>
        <form class="answer-row" id="answerForm">
          <input class="answer" id="answer" type="text" autocomplete="off" spellcheck="false" placeholder="Typ hier je antwoord">
          <button class="button" type="submit">Check</button>
        </form>
      </section>

      <section class="feedback" id="feedback" aria-live="polite">
        <p class="feedback-title" id="feedbackTitle">Klaar voor de overhoring?</p>
        <p class="feedback-text" id="feedbackText">Kies een richting, typ je antwoord en druk op Enter.</p>
      </section>

      <div class="actions">
        <button class="button secondary" id="showAnswer" type="button">Toon antwoord</button>
        <button class="button" id="again" type="button">Volgende</button>
        <button class="button secondary" id="resetQuiz" type="button">Reset score</button>
      </div>
    </section>
  </main>

    const learnTab = document.querySelector("#learnTab");
    const quizTab = document.querySelector("#quizTab");
    const learnScreen = document.querySelector("#learnScreen");
    const quizScreen = document.querySelector("#quizScreen");
    const learnCategoryEl = document.querySelector("#learnCategory");
    const learnFrenchEl = document.querySelector("#learnFrench");
    const learnDutchEl = document.querySelector("#learnDutch");
    const prevCardBtn = document.querySelector("#prevCard");
    const flipCardBtn = document.querySelector("#flipCard");
    const nextCardBtn = document.querySelector("#nextCard");
    const shuffleLearnBtn = document.querySelector("#shuffleLearn");
    const searchEl = document.querySelector("#search");
    const categoryFilterEl = document.querySelector("#categoryFilter");
    const wordListEl = document.querySelector("#wordList");
    const quizCategoryEl = document.querySelector("#quizCategory");
    const quizPromptEl = document.querySelector("#quizPrompt");
    const answerForm = document.querySelector("#answerForm");
    const answerEl = document.querySelector("#answer");
    const feedbackEl = document.querySelector("#feedback");
    const feedbackTitleEl = document.querySelector("#feedbackTitle");
    const feedbackTextEl = document.querySelector("#feedbackText");
    const correctEl = document.querySelector("#correct");
    const triesEl = document.querySelector("#tries");
    const streakEl = document.querySelector("#streak");
    const starsEl = document.querySelector("#stars");
    const totalWordsEl = document.querySelector("#totalWords");
    const showAnswerBtn = document.querySelector("#showAnswer");
    const againBtn = document.querySelector("#again");
    const resetQuizBtn = document.querySelector("#resetQuiz");
    const frToNlBtn = document.querySelector("#frToNl");
    const nlToFrBtn = document.querySelector("#nlToFr");
    const mixedModeBtn = document.querySelector("#mixedMode");

    let learnOrder = words.map((_, index) => index);
    let learnIndex = 0;
    let learnFlipped = false;
    let currentWord = null;
    let quizDirection = "fr-nl";
    let activeDirection = "fr-nl";
    let correct = 0;
    let tries = 0;
    let streak = 0;
    let stars = 0;
    let answered = false;
    const mistakes = new Map();

    function normalize(value) {
      return String(value)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[.,;:!?()[\]{}"']/g, " ")
        .replace(/[-/]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function shuffle(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    function displayDutch(word) {
      return word.dutch[word.dutch.length - 1];
    }

    function frenchAnswers(word) {
      return word.frenchAnswers || [word.french];
    }

    function setMode(mode) {
      const learning = mode === "learn";
      learnScreen.classList.toggle("active", learning);
      quizScreen.classList.toggle("active", !learning);
      learnTab.classList.toggle("active", learning);
      learnTab.classList.toggle("secondary", !learning);
      quizTab.classList.toggle("active", !learning);
      quizTab.classList.toggle("secondary", learning);
      if (!learning) {
        nextQuizWord();
      }
    }

    function renderLearnCard() {
      const word = words[learnOrder[learnIndex]];
      learnCategoryEl.textContent = `${word.category} · ${learnIndex + 1}/${learnOrder.length}`;
      if (learnFlipped) {
        learnFrenchEl.textContent = displayDutch(word);
        learnDutchEl.textContent = word.french;
      } else {
        learnFrenchEl.textContent = word.french;
        learnDutchEl.textContent = displayDutch(word);
      }
    }

    function renderCategories() {
      const categories = [...new Set(words.map((word) => word.category))];
      categories.forEach((category) => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        categoryFilterEl.append(option);
      });
    }

    function renderWordList() {
      const query = normalize(searchEl.value);
      const category = categoryFilterEl.value;
      wordListEl.innerHTML = "";

      words
        .map((word, index) => ({ ...word, index }))
        .filter((word) => category === "all" || word.category === category)
        .filter((word) => {
          const haystack = normalize(`${word.french} ${word.dutch.join(" ")} ${word.category}`);
          return !query || haystack.includes(query);
        })
        .forEach((word) => {
          const row = document.createElement("button");
          row.className = "word-row";
          row.type = "button";
          row.innerHTML = `
            <span class="row-french">${word.french}</span>
            <span class="row-dutch">${displayDutch(word)}</span>
            <span class="row-cat">${word.category}</span>
          `;
          row.addEventListener("click", () => {
            const position = learnOrder.indexOf(word.index);
            learnIndex = position >= 0 ? position : 0;
            if (position < 0) learnOrder = words.map((_, index) => index);
            renderLearnCard();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
          wordListEl.append(row);
        });
    }

    function nextLearnCard(step) {
      learnIndex = (learnIndex + step + learnOrder.length) % learnOrder.length;
      renderLearnCard();
    }

    function shuffleLearn() {
      learnOrder = shuffle(words.map((_, index) => index));
      learnIndex = 0;
      renderLearnCard();
    }

    function pickQuizWord() {
      const weighted = words.flatMap((word, index) => {
        const misses = mistakes.get(index) || 0;
        return Array(Math.min(5, misses + 1)).fill({ ...word, id: index });
      });
      const options = shuffle(weighted);
      return options.find((word) => !currentWord || word.id !== currentWord.id) || options[0];
    }

    function setFeedback(mode, title, text) {
      feedbackEl.className = `feedback ${mode || ""}`.trim();
      feedbackTitleEl.textContent = title;
      feedbackTextEl.textContent = text;
    }

    function updateStats() {
      correctEl.textContent = correct;
      triesEl.textContent = tries;
      streakEl.textContent = streak;
      starsEl.textContent = stars;
      totalWordsEl.textContent = words.length;
    }

    function activePromptDirection() {
      return quizDirection === "mixed" ? (Math.random() > 0.5 ? "fr-nl" : "nl-fr") : quizDirection;
    }

    function answerList(word) {
      return activeDirection === "fr-nl" ? word.dutch : frenchAnswers(word);
    }

    function expectedAnswer(word) {
      return activeDirection === "fr-nl" ? displayDutch(word) : word.french;
    }

    function nextQuizWord() {
      currentWord = pickQuizWord();
      activeDirection = activePromptDirection();
      answered = false;
      quizPromptEl.textContent = activeDirection === "fr-nl" ? currentWord.french : displayDutch(currentWord);
      quizCategoryEl.textContent = activeDirection === "fr-nl"
        ? `Vertaal naar het Nederlands · ${currentWord.category}`
        : `Vertaal naar het Frans · ${currentWord.category}`;
      answerEl.placeholder = activeDirection === "fr-nl" ? "Typ de Nederlandse betekenis" : "Typ het Franse woord";
      answerEl.value = "";
      answerEl.disabled = false;
      setFeedback("", "Nieuw woord", activeDirection === "fr-nl" ? "Frans naar Nederlands" : "Nederlands naar Frans");
      setTimeout(() => answerEl.focus(), 0);
    }

    function checkAnswer(event) {
      event.preventDefault();
      if (answered) {
        nextQuizWord();
        return;
      }

      const userAnswer = normalize(answerEl.value);
      if (!userAnswer) {
        setFeedback("try", "Nog niets ingevuld", "Typ eerst je antwoord.");
        answerEl.focus();
        return;
      }

      tries += 1;
      const isCorrect = answerList(currentWord).some((answer) => normalize(answer) === userAnswer);

      if (isCorrect) {
        correct += 1;
        streak += 1;
        stars += streak >= 3 ? 2 : 1;
        mistakes.set(currentWord.id, 0);
        answered = true;
        answerEl.disabled = true;
        setFeedback("good", "Goed!", `Antwoord: ${expectedAnswer(currentWord)}`);
      } else {
        streak = 0;
        stars = Math.max(0, stars - 1);
        mistakes.set(currentWord.id, (mistakes.get(currentWord.id) || 0) + 1);
        setFeedback("try", "Bijna", "Probeer nog eens. Dit woord komt later vaker terug.");
        answerEl.select();
      }

      updateStats();
    }

    function showAnswer() {
      if (!currentWord) return;
      answered = true;
      streak = 0;
      mistakes.set(currentWord.id, (mistakes.get(currentWord.id) || 0) + 1);
      answerEl.value = expectedAnswer(currentWord);
      answerEl.disabled = true;
      setFeedback("try", "Antwoord", expectedAnswer(currentWord));
      updateStats();
    }

    function resetQuiz() {
      correct = 0;
      tries = 0;
      streak = 0;
      stars = 0;
      mistakes.clear();
      updateStats();
      nextQuizWord();
    }

    function setDirection(direction) {
      quizDirection = direction;
      frToNlBtn.classList.toggle("active", direction === "fr-nl");
      frToNlBtn.classList.toggle("secondary", direction !== "fr-nl");
      nlToFrBtn.classList.toggle("active", direction === "nl-fr");
      nlToFrBtn.classList.toggle("blue", direction !== "nl-fr");
      mixedModeBtn.classList.toggle("active", direction === "mixed");
      mixedModeBtn.classList.toggle("secondary", direction !== "mixed");
      nextQuizWord();
    }

    learnTab.addEventListener("click", () => setMode("learn"));
    quizTab.addEventListener("click", () => setMode("quiz"));
    prevCardBtn.addEventListener("click", () => nextLearnCard(-1));
    flipCardBtn.addEventListener("click", () => {
      learnFlipped = !learnFlipped;
      renderLearnCard();
    });
    nextCardBtn.addEventListener("click", () => nextLearnCard(1));
    shuffleLearnBtn.addEventListener("click", shuffleLearn);
    searchEl.addEventListener("input", renderWordList);
    categoryFilterEl.addEventListener("change", renderWordList);
    answerForm.addEventListener("submit", checkAnswer);
    showAnswerBtn.addEventListener("click", showAnswer);
    againBtn.addEventListener("click", nextQuizWord);
    resetQuizBtn.addEventListener("click", resetQuiz);
    frToNlBtn.addEventListener("click", () => setDirection("fr-nl"));
    nlToFrBtn.addEventListener("click", () => setDirection("nl-fr"));
    mixedModeBtn.addEventListener("click", () => setDirection("mixed"));

    renderCategories();
    renderLearnCard();
    renderWordList();
    updateStats();
  </script>
