<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio Bewerker (MP3/WAV)</title>
    <style>
      :root {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color-scheme: dark;
        --bg: #0e1016;
        --panel: #171c27;
        --line: #2e3648;
        --text: #e7ecf6;
        --muted: #aab7cf;
        --accent: #7dafff;
        --accent-2: #8bf5d5;
        --error: #ff9d9d;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #181f2c, var(--bg));
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 1rem;
      }

      .card {
        width: min(100%, 760px);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem;
        background: var(--panel);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.45rem;
      }

      .controls {
        display: grid;
        gap: 0.9rem;
      }

      .row {
        display: grid;
        gap: 0.4rem;
      }

      .row-inline {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }

      input[type="file"],
      input[type="range"] {
        width: 100%;
      }

      input[type="range"] {
        accent-color: var(--accent);
      }

      .btn {
        border: 1px solid var(--line);
        color: var(--text);
        background: #222b3f;
        border-radius: 8px;
        padding: 0.5rem 0.75rem;
        cursor: pointer;
      }

      .btn:hover {
        background: #2c3752;
      }

      .btn.speed {
        min-width: 44px;
        font-weight: 700;
      }

      .value {
        font-weight: 700;
        color: var(--accent-2);
      }

      .hint {
        color: var(--muted);
        margin: 0;
      }

      .status {
        margin: 0;
        min-height: 1.2rem;
        color: var(--muted);
      }

      .status.error {
        color: var(--error);
      }

      .transport {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      progress {
        width: min(380px, 100%);
        height: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Audio Bewerker (MP3/WAV)</h1>

      <div class="controls">
        <label class="row" for="audioFile">
          Open audio (MP3/WAV)
          <input id="audioFile" type="file" accept="audio/mpeg,.mp3,audio/wav,.wav,audio/*" />
        </label>

        <div class="transport">
          <button id="playBtn" class="btn" type="button">Play</button>
          <button id="stopBtn" class="btn" type="button">Stop</button>
          <span><strong>Tijd:</strong> <span id="timeLabel" class="value">0.00 / 0.00 s</span></span>
          <progress id="progressBar" max="1" value="0"></progress>
        </div>

        <div class="row">
          <strong>Snelheid (real-time)</strong>
          <div class="row-inline">
            <button id="speedDown" class="btn speed" type="button">-</button>
            <span id="speedValue" class="value">1.00x</span>
            <button id="speedUp" class="btn speed" type="button">+</button>
          </div>
          <input id="speedSlider" type="range" min="0.5" max="2" step="0.01" value="1" />
        </div>

        <div class="row">
          <label for="atonalToggle">
            <input id="atonalToggle" type="checkbox" />
            Atonaal aan (random pitch)
          </label>
          <label for="pitchRange">
            Pitch-afstand vanaf origineel: <span id="pitchRangeValue" class="value">300 cent</span>
          </label>
          <input id="pitchRange" type="range" min="0" max="1200" step="10" value="300" />
          <label for="changeMs">
            Random update interval: <span id="changeMsValue" class="value">180 ms</span>
          </label>
          <input id="changeMs" type="range" min="40" max="800" step="10" value="180" />
        </div>

        <div class="row">
          <label for="distAmount">
            Vervorming (waveshaper): <span id="distValue" class="value">0%</span>
          </label>
          <input id="distAmount" type="range" min="0" max="100" step="1" value="0" />
        </div>

        <p class="hint">Deze versie gebruikt granular preview zodat pitch-randomisatie en tempo los van elkaar kunnen bewegen.</p>
        <p id="status" class="status" aria-live="polite"></p>
      </div>
    </main>

    <script>
      const audioFile = document.getElementById('audioFile');
      const playBtn = document.getElementById('playBtn');
      const stopBtn = document.getElementById('stopBtn');
      const timeLabel = document.getElementById('timeLabel');
      const progressBar = document.getElementById('progressBar');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const speedDown = document.getElementById('speedDown');
      const speedUp = document.getElementById('speedUp');
      const atonalToggle = document.getElementById('atonalToggle');
      const pitchRange = document.getElementById('pitchRange');
      const pitchRangeValue = document.getElementById('pitchRangeValue');
      const changeMs = document.getElementById('changeMs');
      const changeMsValue = document.getElementById('changeMsValue');
      const distAmount = document.getElementById('distAmount');
      const distValue = document.getElementById('distValue');
      const status = document.getElementById('status');

      let audioContext = null;
      let masterGain = null;
      let distortionNode = null;
      let loadedBuffer = null;
      let isPlaying = false;
      let schedulerTimer = null;
      let uiTimer = null;

      let manualSpeed = 1;
      let sourcePosition = 0;
      let nextScheduleTime = 0;
      let elapsedOutputTime = 0;
      let lastRandomPitchCents = 0;
      let nextRandomUpdateTime = 0;

      const grainSize = 0.08;
      const overlap = 0.5;
      const outputHop = grainSize * (1 - overlap);
      const scheduleAheadTime = 0.2;
      const schedulerIntervalMs = 25;

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle('error', isError);
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function formatSeconds(seconds) {
        return Number(seconds).toFixed(2);
      }

      function makeDistortionCurve(amount = 0) {
        const k = amount * 10;
        const nSamples = 44100;
        const curve = new Float32Array(nSamples);
        const deg = Math.PI / 180;

        for (let i = 0; i < nSamples; i += 1) {
          const x = (i * 2) / nSamples - 1;
          curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
        }

        return curve;
      }

      async function ensureAudioGraph() {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          masterGain = audioContext.createGain();
          distortionNode = audioContext.createWaveShaper();
          distortionNode.curve = makeDistortionCurve(0);
          distortionNode.oversample = '4x';

          masterGain.connect(distortionNode);
          distortionNode.connect(audioContext.destination);
        }

        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }
      }

      function applySpeed(value) {
        manualSpeed = clamp(value, 0.5, 2);
        speedSlider.value = manualSpeed.toFixed(2);
        speedValue.textContent = `${manualSpeed.toFixed(2)}x`;
      }

      function computeCurrentPitchCents(now) {
        if (!atonalToggle.checked) {
          return 0;
        }

        if (now >= nextRandomUpdateTime) {
          const cents = Number(pitchRange.value);
          lastRandomPitchCents = (Math.random() * 2 - 1) * cents;
          nextRandomUpdateTime = now + Number(changeMs.value) / 1000;
        }

        return lastRandomPitchCents;
      }

      function scheduleGrain(startTime, offsetSec, playbackRate) {
        const grainSource = audioContext.createBufferSource();
        grainSource.buffer = loadedBuffer;
        grainSource.playbackRate.value = playbackRate;

        const gainNode = audioContext.createGain();
        const fadeTime = grainSize * 0.5;

        gainNode.gain.setValueAtTime(0, startTime);
        gainNode.gain.linearRampToValueAtTime(1, startTime + fadeTime);
        gainNode.gain.linearRampToValueAtTime(0, startTime + grainSize);

        grainSource.connect(gainNode);
        gainNode.connect(masterGain);

        const sourceDuration = Math.min(grainSize / playbackRate, loadedBuffer.duration - offsetSec);
        if (sourceDuration <= 0) return;

        grainSource.start(startTime, offsetSec, sourceDuration);
      }

      function scheduleAudio() {
        if (!isPlaying || !loadedBuffer) return;

        while (nextScheduleTime < audioContext.currentTime + scheduleAheadTime) {
          const pitchCents = computeCurrentPitchCents(nextScheduleTime);
          const pitchRatio = Math.pow(2, pitchCents / 1200);
          scheduleGrain(nextScheduleTime, sourcePosition, pitchRatio);

          sourcePosition += outputHop * manualSpeed;
          while (sourcePosition >= loadedBuffer.duration) {
            sourcePosition -= loadedBuffer.duration;
          }

          elapsedOutputTime += outputHop;
          if (elapsedOutputTime >= loadedBuffer.duration) {
            elapsedOutputTime -= loadedBuffer.duration;
          }

          nextScheduleTime += outputHop;
        }
      }

      function startUiTimer() {
        if (uiTimer) clearInterval(uiTimer);
        uiTimer = setInterval(() => {
          if (!loadedBuffer) {
            timeLabel.textContent = '0.00 / 0.00 s';
            progressBar.value = 0;
            return;
          }

          const current = elapsedOutputTime;
          const total = loadedBuffer.duration;
          timeLabel.textContent = `${formatSeconds(current)} / ${formatSeconds(total)} s`;
          progressBar.value = total > 0 ? current / total : 0;
        }, 80);
      }

      async function loadFile(file) {
        await ensureAudioGraph();
        const data = await file.arrayBuffer();
        loadedBuffer = await audioContext.decodeAudioData(data.slice(0));
        sourcePosition = 0;
        elapsedOutputTime = 0;
        progressBar.value = 0;
        timeLabel.textContent = `0.00 / ${formatSeconds(loadedBuffer.duration)} s`;
        setStatus(`Bestand geladen: ${file.name}`);
      }

      function startPlayback() {
        if (!loadedBuffer || !audioContext) {
          setStatus('Laad eerst een MP3/WAV bestand.', true);
          return;
        }

        if (isPlaying) return;

        isPlaying = true;
        nextScheduleTime = audioContext.currentTime + 0.03;
        nextRandomUpdateTime = audioContext.currentTime;
        schedulerTimer = setInterval(scheduleAudio, schedulerIntervalMs);
        startUiTimer();
        setStatus('Live preview actief.');
      }

      function stopPlayback() {
        isPlaying = false;
        if (schedulerTimer) {
          clearInterval(schedulerTimer);
          schedulerTimer = null;
        }
        if (uiTimer) {
          clearInterval(uiTimer);
          uiTimer = null;
        }
      }

      audioFile.addEventListener('change', async () => {
        const file = audioFile.files?.[0];
        if (!file) return;

        try {
          stopPlayback();
          await loadFile(file);
        } catch (error) {
          setStatus(`Kon audio niet laden: ${error.message}`, true);
        }
      });

      playBtn.addEventListener('click', async () => {
        try {
          await ensureAudioGraph();
          startPlayback();
        } catch (error) {
          setStatus(`Kan afspelen niet starten: ${error.message}`, true);
        }
      });

      stopBtn.addEventListener('click', () => {
        stopPlayback();
        setStatus('Gestopt.');
      });

      speedSlider.addEventListener('input', () => {
        applySpeed(Number(speedSlider.value));
      });

      speedDown.addEventListener('click', () => {
        applySpeed(manualSpeed - 0.05);
      });

      speedUp.addEventListener('click', () => {
        applySpeed(manualSpeed + 0.05);
      });

      pitchRange.addEventListener('input', () => {
        pitchRangeValue.textContent = `${pitchRange.value} cent`;
      });

      changeMs.addEventListener('input', () => {
        changeMsValue.textContent = `${changeMs.value} ms`;
      });

      distAmount.addEventListener('input', () => {
        const value = Number(distAmount.value);
        distValue.textContent = `${value}%`;
        if (distortionNode) {
          distortionNode.curve = makeDistortionCurve(value / 100);
        }
      });

      window.addEventListener('beforeunload', () => {
        stopPlayback();
      });

      applySpeed(1);
      pitchRangeValue.textContent = `${pitchRange.value} cent`;
      changeMsValue.textContent = `${changeMs.value} ms`;
      distValue.textContent = `${distAmount.value}%`;
    </script>
  </body>
</html>
