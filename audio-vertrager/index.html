<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio Bewerker (MP3/WAV)</title>
    <style>
      :root {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color-scheme: dark;
        --bg: #0e1016;
        --panel: #171c27;
        --line: #2e3648;
        --text: #e7ecf6;
        --muted: #aab7cf;
        --accent: #7dafff;
        --accent-2: #8bf5d5;
        --error: #ff9d9d;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #181f2c, var(--bg));
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 1rem;
      }

      .card {
        width: min(100%, 700px);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem;
        background: var(--panel);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.45rem;
      }

      .controls {
        display: grid;
        gap: 0.9rem;
      }

      .row {
        display: grid;
        gap: 0.4rem;
      }

      .row-inline {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }

      input[type="file"],
      input[type="range"] {
        width: 100%;
      }

      input[type="range"] {
        accent-color: var(--accent);
      }

      .btn {
        border: 1px solid var(--line);
        color: var(--text);
        background: #222b3f;
        border-radius: 8px;
        padding: 0.5rem 0.75rem;
        cursor: pointer;
      }

      .btn:hover {
        background: #2c3752;
      }

      .btn.speed {
        min-width: 44px;
        font-weight: 700;
      }

      .value {
        font-weight: 700;
        color: var(--accent-2);
      }

      .hint {
        color: var(--muted);
        margin: 0;
      }

      .status {
        margin: 0;
        min-height: 1.2rem;
        color: var(--muted);
      }

      .status.error {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Audio Bewerker (MP3/WAV)</h1>

      <div class="controls">
        <label class="row" for="audioFile">
          Open audio (MP3/WAV)
          <input id="audioFile" type="file" accept="audio/mpeg,.mp3,audio/wav,.wav,audio/*" />
        </label>

        <audio id="player" controls preload="metadata"></audio>

        <div class="row">
          <strong>Snelheid (real-time)</strong>
          <div class="row-inline">
            <button id="speedDown" class="btn speed" type="button">-</button>
            <span id="speedValue" class="value">1.00x</span>
            <button id="speedUp" class="btn speed" type="button">+</button>
          </div>
          <input id="speedSlider" type="range" min="0.5" max="2" step="0.01" value="1" />
        </div>

        <div class="row">
          <label for="atonalToggle">
            <input id="atonalToggle" type="checkbox" />
            Atonaal aan (random pitch)
          </label>
          <label for="pitchRange">
            Pitch-afstand vanaf origineel: <span id="pitchRangeValue" class="value">300 cent</span>
          </label>
          <input id="pitchRange" type="range" min="0" max="1200" step="10" value="300" />
          <label for="changeMs">
            Random update interval: <span id="changeMsValue" class="value">180 ms</span>
          </label>
          <input id="changeMs" type="range" min="40" max="800" step="10" value="180" />
        </div>

        <div class="row">
          <label for="distAmount">
            Vervorming (waveshaper): <span id="distValue" class="value">0%</span>
          </label>
          <input id="distAmount" type="range" min="0" max="100" step="1" value="0" />
        </div>

        <p class="hint">
          Technisch: snelheid + random pitch worden uitgevoerd via <code>playbackRate</code>. Daardoor zijn ze aan elkaar gekoppeld.
        </p>
        <p id="status" class="status" aria-live="polite"></p>
      </div>
    </main>

    <script>
      const audioFile = document.getElementById('audioFile');
      const player = document.getElementById('player');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const speedDown = document.getElementById('speedDown');
      const speedUp = document.getElementById('speedUp');
      const atonalToggle = document.getElementById('atonalToggle');
      const pitchRange = document.getElementById('pitchRange');
      const pitchRangeValue = document.getElementById('pitchRangeValue');
      const changeMs = document.getElementById('changeMs');
      const changeMsValue = document.getElementById('changeMsValue');
      const distAmount = document.getElementById('distAmount');
      const distValue = document.getElementById('distValue');
      const status = document.getElementById('status');

      let objectUrl = null;
      let audioContext = null;
      let sourceNode = null;
      let distortionNode = null;
      let atonalTimer = null;
      let manualSpeed = 1;

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle('error', isError);
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function makeDistortionCurve(amount = 0) {
        const k = amount * 10;
        const nSamples = 44100;
        const curve = new Float32Array(nSamples);
        const deg = Math.PI / 180;

        for (let i = 0; i < nSamples; i += 1) {
          const x = (i * 2) / nSamples - 1;
          curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
        }

        return curve;
      }

      async function ensureAudioGraph() {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          sourceNode = audioContext.createMediaElementSource(player);
          distortionNode = audioContext.createWaveShaper();
          distortionNode.curve = makeDistortionCurve(0);
          distortionNode.oversample = '4x';

          sourceNode.connect(distortionNode);
          distortionNode.connect(audioContext.destination);
        }

        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }
      }

      function applySpeed(value) {
        manualSpeed = clamp(value, 0.5, 2);
        player.playbackRate = manualSpeed;
        speedSlider.value = manualSpeed.toFixed(2);
        speedValue.textContent = `${manualSpeed.toFixed(2)}x`;
      }

      function randomizePitch() {
        if (!atonalToggle.checked) {
          player.playbackRate = manualSpeed;
          return;
        }

        const cents = Number(pitchRange.value);
        const randomCents = (Math.random() * 2 - 1) * cents;
        const randomRatio = Math.pow(2, randomCents / 1200);
        const newRate = clamp(manualSpeed * randomRatio, 0.5, 2);

        player.playbackRate = newRate;
      }

      function restartAtonalTimer() {
        if (atonalTimer) {
          clearInterval(atonalTimer);
          atonalTimer = null;
        }

        if (!atonalToggle.checked) {
          player.playbackRate = manualSpeed;
          return;
        }

        randomizePitch();
        atonalTimer = setInterval(randomizePitch, Number(changeMs.value));
      }

      audioFile.addEventListener('change', async () => {
        const file = audioFile.files?.[0];
        if (!file) return;

        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = URL.createObjectURL(file);
        player.src = objectUrl;

        try {
          await ensureAudioGraph();
          setStatus(`Bestand geladen: ${file.name}`);
        } catch (error) {
          setStatus(`Audio context fout: ${error.message}`, true);
        }
      });

      player.addEventListener('play', async () => {
        try {
          await ensureAudioGraph();
          restartAtonalTimer();
        } catch (error) {
          setStatus(`Kan afspelen niet starten: ${error.message}`, true);
        }
      });

      player.addEventListener('pause', () => {
        if (atonalTimer) {
          clearInterval(atonalTimer);
          atonalTimer = null;
        }
        player.playbackRate = manualSpeed;
      });

      speedSlider.addEventListener('input', () => {
        applySpeed(Number(speedSlider.value));
        if (atonalToggle.checked) randomizePitch();
      });

      speedDown.addEventListener('click', () => {
        applySpeed(manualSpeed - 0.05);
        if (atonalToggle.checked) randomizePitch();
      });

      speedUp.addEventListener('click', () => {
        applySpeed(manualSpeed + 0.05);
        if (atonalToggle.checked) randomizePitch();
      });

      atonalToggle.addEventListener('change', () => {
        restartAtonalTimer();
      });

      pitchRange.addEventListener('input', () => {
        pitchRangeValue.textContent = `${pitchRange.value} cent`;
      });

      changeMs.addEventListener('input', () => {
        changeMsValue.textContent = `${changeMs.value} ms`;
        restartAtonalTimer();
      });

      distAmount.addEventListener('input', () => {
        const value = Number(distAmount.value);
        distValue.textContent = `${value}%`;
        if (distortionNode) {
          distortionNode.curve = makeDistortionCurve(value / 100);
        }
      });

      player.addEventListener('error', () => {
        setStatus('Kan dit audiobestand niet laden. Probeer een andere MP3/WAV.', true);
      });

      window.addEventListener('beforeunload', () => {
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        if (atonalTimer) clearInterval(atonalTimer);
      });

      applySpeed(1);
      pitchRangeValue.textContent = `${pitchRange.value} cent`;
      changeMsValue.textContent = `${changeMs.value} ms`;
      distValue.textContent = `${distAmount.value}%`;
    </script>
  </body>
</html>
