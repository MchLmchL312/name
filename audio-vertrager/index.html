<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MP3 afspelen met lagere snelheid</title>
    <style>
      :root {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color-scheme: dark;
        --bg: #0f1117;
        --panel: #1a1f2b;
        --line: #31394d;
        --text: #e7ecf6;
        --muted: #b3bfd4;
        --accent: #74a8ff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: radial-gradient(circle at top, #151a24, var(--bg));
        color: var(--text);
      }

      .card {
        width: min(100%, 560px);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem;
        background: var(--panel);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      }

      .row {
        margin-top: 1rem;
      }

      input[type="file"],
      input[type="range"] {
        width: 100%;
        margin-top: 0.35rem;
      }

      input[type="range"] {
        accent-color: var(--accent);
      }

      .value {
        font-weight: 700;
      }

      .hint {
        opacity: 0.9;
        color: var(--muted);
      }

      .btn {
        margin-top: 0.7rem;
        border: 1px solid var(--line);
        background: #20283a;
        color: var(--text);
        border-radius: 8px;
        padding: 0.55rem 0.75rem;
        cursor: pointer;
      }

      .btn:hover {
        background: #27324a;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>MP3 speler met snelheids-slider</h1>

      <label for="audioFile">
        Kies een audiofile (mp3):
        <input id="audioFile" type="file" accept="audio/mpeg,.mp3,audio/*" />
      </label>
      <button id="exampleBtn" type="button" class="btn">Voorbeeld openen (Enea Leone)</button>

      <div class="row">
        <audio id="player" controls></audio>
      </div>

      <div class="row">
        <label for="speed">Afspeelsnelheid: <span id="speedValue" class="value">1.00x</span></label>
        <input id="speed" type="range" min="0.01" max="1" step="0.01" value="1" />
      </div>

      <p class="hint">De toonhoogte blijft gelijk (pitch correction staat aan).</p>
    </main>

    <script>
      const fileInput = document.getElementById('audioFile');
      const player = document.getElementById('player');
      const speedSlider = document.getElementById('speed');
      const speedValue = document.getElementById('speedValue');
      const exampleBtn = document.getElementById('exampleBtn');

      let objectUrl = null;
      const exampleFile = 'Enea Leone - [2014] (Sor - Complete Studies for Guitar) - 104 - Op 6 - No 7, Allegro.mp3';

      player.preservesPitch = true;
      player.mozPreservesPitch = true;
      player.webkitPreservesPitch = true;

      fileInput.addEventListener('change', () => {
        const file = fileInput.files?.[0];
        if (!file) return;

        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = URL.createObjectURL(file);

        player.src = objectUrl;
        player.playbackRate = Number(speedSlider.value);
        player.load();
      });

      speedSlider.addEventListener('input', () => {
        const rate = Number(speedSlider.value);
        player.playbackRate = rate;
        speedValue.textContent = `${rate.toFixed(2)}x`;
      });

      exampleBtn.addEventListener('click', () => {
        if (objectUrl) {
          URL.revokeObjectURL(objectUrl);
          objectUrl = null;
        }

        fileInput.value = '';
        player.src = encodeURI(exampleFile);
        player.playbackRate = Number(speedSlider.value);
        player.load();
      });

      window.addEventListener('beforeunload', () => {
        if (objectUrl) URL.revokeObjectURL(objectUrl);
      });
    </script>
  </body>
</html>
