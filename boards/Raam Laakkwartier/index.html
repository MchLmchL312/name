<!doctype html>
<html lang="nl">
<head>
  <link rel="icon" href="../../favicon.ico?v=3" sizes="any">
  <link rel="icon" href="../../favicon_MchL.png?v=3" type="image/png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raam Laakkwartier</title>
  <style>
    :root {
      --bg: #080809;
      --panel: #151516;
      --text: rgba(255,255,255,.94);
      --muted: rgba(255,255,255,.64);
      --line: rgba(255,255,255,.14);
      --maxw: 1180px;
      --pad: clamp(14px, 3vw, 24px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(8,8,9,.82);
      backdrop-filter: blur(12px);
    }

    .wrap {
      width: 100%;
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 var(--pad);
    }

    .topbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 4vw, 42px);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: 0;
    }

    .email-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      color: var(--text);
      border: 1px solid transparent;
      border-radius: 8px;
      text-decoration: none;
      flex: 0 0 auto;
    }

    .email-link:hover,
    .email-link:focus-visible {
      border-color: var(--line);
      background: rgba(255,255,255,.05);
      outline: none;
    }

    .email-link svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
    }

    main {
      padding: var(--pad) 0 48px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(10px, 2vw, 18px);
      align-items: start;
    }

    figure {
      margin: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    button.photo {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: #000;
      cursor: zoom-in;
      color: inherit;
    }

    button.photo:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    .thumb {
      aspect-ratio: 4 / 3;
      object-fit: cover;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    button.photo:hover .thumb {
      transform: scale(1.015);
      opacity: .92;
    }

    figcaption {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .date {
      flex: 0 0 auto;
    }

    .empty {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      line-height: 1.6;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.94);
      cursor: zoom-out;
    }

    .overlay.show {
      display: flex;
    }

    .overlay img {
      position: relative;
      z-index: 1;
      width: auto;
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 18px 70px rgba(0,0,0,.55);
      cursor: e-resize;
    }

    .overlay-date {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(8,8,9,.72);
      color: var(--text);
      font-size: 13px;
      pointer-events: none;
    }

    .nav-zone {
      position: fixed;
      z-index: 2;
      top: 50%;
      width: 48px;
      height: 96px;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: transparent;
      color: rgba(255,255,255,.42);
      font-size: 52px;
      font-weight: 200;
      line-height: 1;
      cursor: pointer;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-zone.prev {
      left: 14px;
      cursor: w-resize;
    }

    .nav-zone.next {
      right: 14px;
      cursor: e-resize;
    }

    .nav-zone:hover,
    .nav-zone:focus-visible {
      color: rgba(255,255,255,.9);
      background: transparent;
    }

    .nav-zone:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    @media (max-width: 560px) {
      .topbar {
        min-height: 76px;
        align-items: flex-start;
        justify-content: center;
        flex-direction: column;
        padding: 14px 0;
      }

      .email-link {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="topbar">
        <h1>Raam Laakkwartier</h1>
        <a class="email-link" href="mailto:machielvansoest@outlook.com" aria-label="E-mail">
          <svg xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 24 24" fill="none" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0
            1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2
            2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="gallery" id="gallery" aria-label="Foto's"></section>
    </div>
  </main>

  <div class="overlay" id="overlay" aria-hidden="true">
    <button class="nav-zone prev" type="button" id="prevPhoto" aria-label="Vorige foto">&lsaquo;</button>
    <img src="" alt="" id="overlayImage">
    <button class="nav-zone next" type="button" id="nextPhoto" aria-label="Volgende foto">&rsaquo;</button>
    <div class="overlay-date" id="overlayDate"></div>
  </div>

  <script src="photos.js"></script>
  <script>
    const photos = Array.isArray(window.RAAM_LAAKKWARTIER_PHOTOS)
      ? window.RAAM_LAAKKWARTIER_PHOTOS
      : [];

    const gallery = document.getElementById('gallery');
    const overlay = document.getElementById('overlay');
    const overlayImage = document.getElementById('overlayImage');
    const overlayDate = document.getElementById('overlayDate');
    const prevPhoto = document.getElementById('prevPhoto');
    const nextPhoto = document.getElementById('nextPhoto');
    let activeIndex = -1;

    const dateFormatter = new Intl.DateTimeFormat('nl-NL', {
      year: 'numeric',
      month: 'short',
      day: 'numeric'
    });

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return dateFormatter.format(date);
    }

    function showEmptyMessage() {
      const message = document.createElement('div');
      message.className = 'empty';
      message.textContent = 'Nog geen foto\'s gevonden. Zet foto\'s in deze map en voer update-photos.py opnieuw uit.';
      gallery.appendChild(message);
    }

    function showPhoto(index) {
      if (!photos.length) return;

      activeIndex = (index + photos.length) % photos.length;
      const photo = photos[activeIndex];
      overlayImage.src = photo.src;
      overlayImage.alt = `Foto ${activeIndex + 1}`;
      overlayDate.textContent = formatDate(photo.date);
    }

    function openOverlay(index) {
      showPhoto(index);
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
    }

    function closeOverlay() {
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
      overlayImage.src = '';
      overlayImage.alt = '';
      overlayDate.textContent = '';
      activeIndex = -1;
    }

    function goPrevious() {
      if (activeIndex >= 0) showPhoto(activeIndex - 1);
    }

    function goNext() {
      if (activeIndex >= 0) showPhoto(activeIndex + 1);
    }

    function renderGallery() {
      if (!photos.length) {
        showEmptyMessage();
        return;
      }

      photos.forEach((photo, index) => {
        const figure = document.createElement('figure');
        const button = document.createElement('button');
        const image = document.createElement('img');
        const caption = document.createElement('figcaption');
        const date = document.createElement('span');

        button.type = 'button';
        button.className = 'photo';
        button.setAttribute('aria-label', `Open foto ${index + 1}`);

        image.className = 'thumb';
        image.src = photo.src;
        image.alt = `Foto ${index + 1}`;
        image.loading = 'lazy';
        image.decoding = 'async';

        date.className = 'date';
        date.textContent = formatDate(photo.date);

        button.appendChild(image);
        caption.append(date);
        figure.append(button, caption);
        gallery.appendChild(figure);

        button.addEventListener('click', () => openOverlay(index));
      });
    }

    overlay.addEventListener('click', event => {
      if (event.target === overlay) closeOverlay();
    });
    overlayImage.addEventListener('click', event => {
      event.stopPropagation();
      goNext();
    });
    prevPhoto.addEventListener('click', event => {
      event.stopPropagation();
      goPrevious();
    });
    nextPhoto.addEventListener('click', event => {
      event.stopPropagation();
      goNext();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeOverlay();
      if (event.key === 'ArrowLeft') goPrevious();
      if (event.key === 'ArrowRight') goNext();
    });

    renderGallery();
  </script>
</body>
</html>
