<!doctype html>
<html lang="nl">
<head>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" href="/favicon_MchL.png?v=2" type="image/png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube autoplay embed</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column; /* zorgt dat #2 onder #1 komt */
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      padding: 16px 0; /* kleine boven/onder marge */
      gap: 16px;       /* ruimte tussen de twee video’s */
    }
    .video-wrap {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <!-- Bestaande video -->
  <div class="video-wrap">
    <iframe
      src="https://www.youtube-nocookie.com/embed/ZLD-nyIyYz0?autoplay=1&mute=1&loop=0&rel=0"
      title="YouTube video player"
      loading="lazy"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Nieuwe video eronder -->
  <div class="video-wrap">
    <iframe
      src="https://www.youtube-nocookie.com/embed/cfDGH_rwVrQ?autoplay=0&rel=0&modestbranding=1"
      title="YouTube video"
      loading="lazy"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
      playsinline>
    </iframe>
  </div>
</body>
</html>
