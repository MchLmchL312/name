<!DOCTYPE html>
<html lang="nl">
<head>
  <link rel="icon" href="../favicon.ico?v=3" sizes="any">
  <link rel="icon" href="../favicon_MchL.png?v=3" type="image/png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MP3 speler (Google Drive)</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
    }
    .frame {
      width: 90vw;
      max-width: 900px;
      aspect-ratio: 16 / 9; /* genoeg hoogte voor Drive-player */
      background: #111;
      border: 2px solid #333;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255,255,255,0.15);
    }
    .fallback {
      margin-top: 1rem;
      text-align: center;
      font-size: .9rem;
      color: #aaa;
    }
    .fallback a { color: #fff; }
  </style>
</head>
<body>
  <div>
    <div class="frame">
      <iframe
        src="https://drive.google.com/file/d/13hetDfIeN3Wjut-kgrW7Z-yrcoYOJ1Zx/preview"
        width="100%"
        height="100%"
        allow="autoplay"
        style="border:0"
      ></iframe>
    </div>
    <p class="fallback"> <a href="https://drive.google.com/uc?export=download&id=13hetDfIeN3Wjut-kgrW7Z-yrcoYOJ1Zx" target="_blank" rel="noopener">download de MP3</a>.
    </p>
  </div>
</body>
</html>
