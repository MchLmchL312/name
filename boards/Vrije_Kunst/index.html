<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vrije Kunst | Machiel van Soest</title>
    <meta name="description" content="Vrije Kunst bij het Stadskantoor: beelden en poster van Machiel van Soest.">
    <meta name="author" content="Machiel van Soest">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.machielvansoest.nl/boards/Vrije_Kunst/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="nl_NL">
    <meta property="og:site_name" content="Machiel van Soest">
    <meta property="og:title" content="Vrije Kunst | Machiel van Soest">
    <meta property="og:description" content="Beelden en poster van Vrije Kunst bij het Stadskantoor.">
    <meta property="og:url" content="https://www.machielvansoest.nl/boards/Vrije_Kunst/">
    <meta property="og:image" content="https://www.machielvansoest.nl/boards/Vrije_Kunst/vrije_kunst_poster.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <style>
      :root {
        color-scheme: light;
        --ink: #171717;
        --muted: #62635f;
        --paper: #f5f1e9;
        --surface: rgba(255, 255, 255, 0.72);
        --line: rgba(23, 23, 23, 0.16);
        --accent: #6f4d72;
        --accent-dark: #4c3150;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(135deg, rgba(111, 77, 114, 0.14), transparent 36%),
          linear-gradient(315deg, rgba(47, 95, 79, 0.12), transparent 42%),
          var(--paper);
      }

      a {
        color: inherit;
      }

      .page {
        width: min(100% - 32px, 1180px);
        margin: 0 auto;
        padding: clamp(18px, 5vw, 56px) 0;
      }

      .topnav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        margin-bottom: clamp(28px, 5vw, 54px);
        color: var(--muted);
        font-size: 0.95rem;
      }

      .topnav a {
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        text-decoration-thickness: 1.3px;
        text-underline-offset: 5px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(280px, 0.95fr);
        gap: clamp(24px, 5vw, 54px);
        align-items: end;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 760;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 9ch;
        margin: 0;
        font-size: clamp(3rem, 10vw, 7rem);
        line-height: 0.92;
        letter-spacing: 0;
      }

      .lead {
        max-width: 38rem;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(1.05rem, 2vw, 1.3rem);
        line-height: 1.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      .button {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        color: #fff;
        background: var(--accent);
        border: 1px solid transparent;
        border-radius: 8px;
        font-weight: 700;
        text-decoration: none;
      }

      .button.secondary {
        color: var(--ink);
        background: var(--surface);
        border-color: var(--line);
      }

      .button:hover,
      .button:focus-visible {
        background: var(--accent-dark);
        outline: none;
      }

      .button.secondary:hover,
      .button.secondary:focus-visible {
        color: #fff;
        border-color: transparent;
      }

      .poster,
      figure {
        display: block;
        margin: 0;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.58);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 24px 80px rgba(23, 23, 23, 0.1);
      }

      .poster img,
      figure img {
        display: block;
        width: 100%;
        height: auto;
      }

      .gallery {
        margin-top: clamp(30px, 6vw, 70px);
      }

      .gallery h2 {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 760;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .image-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      figcaption {
        padding: 12px 14px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      @media (max-width: 820px) {
        .hero,
        .image-grid {
          grid-template-columns: 1fr;
        }

        h1 {
          max-width: 100%;
          font-size: clamp(2.7rem, 16vw, 5.5rem);
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <nav class="topnav" aria-label="Navigatie">
        <a href="../../">Machiel van Soest</a>
        <a href="../">Boards</a>
      </nav>

      <section class="hero" aria-label="Vrije Kunst">
        <div>
          <p class="eyebrow">Project</p>
          <h1>Vrije Kunst</h1>
          <p class="lead">Beelden en poster rond Vrije Kunst bij het Stadskantoor.</p>
          <div class="actions">
            <a class="button" href="https://spectacular-heliotrope-cf53a3.netlify.app/" target="_blank" rel="noopener noreferrer">Open Stadskantoor</a>
            <a class="button secondary" href="vrije_kunst_poster.jpg">Bekijk poster</a>
          </div>
        </div>

        <a class="poster" href="vrije_kunst_poster.jpg" aria-label="Open poster">
          <img src="vrije_kunst_poster.jpg" alt="Poster van Vrije Kunst" fetchpriority="high">
        </a>
      </section>

      <section class="gallery" aria-label="Beelden">
        <h2>Beelden</h2>
        <div class="image-grid">
          <figure>
            <img src="Vrije_Kunst_1.PNG" alt="Vrije Kunst beeld 1" loading="lazy">
            <figcaption>Vrije Kunst 1</figcaption>
          </figure>
          <figure>
            <img src="Vrije_Kunst_2.jpg" alt="Vrije Kunst beeld 2" loading="lazy">
            <figcaption>Vrije Kunst 2</figcaption>
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
