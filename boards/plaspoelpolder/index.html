<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plaspoelpolder</title>
  <style>
    body {
      margin: 0;
      background: #000;
      cursor: pointer;
    }

    img {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img src="PLASPOELPOLDER.png" alt="Plaspoelpolder" draggable="false">
  <img src="ANIMUS.png" alt="Animus" draggable="false" hidden>
  <img src="PTP.png" alt="PTP" draggable="false" hidden>
  <img src="UNE.png" alt="Une" draggable="false" hidden>
  <script>
    const photos = document.querySelectorAll('img');
    let current = 0;

    function changePhoto(step) {
      photos[current].hidden = true;
      current = (current + step + photos.length) % photos.length;
      photos[current].hidden = false;
    }

    document.addEventListener('click', () => {
      changePhoto(1);

      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        changePhoto(event.key === 'ArrowLeft' ? -1 : 1);
      }
    });
  </script>
</body>
</html>
