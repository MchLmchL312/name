<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plaspoelpolder</title>
  <style>
    body {
      margin: 0;
      background: #000;
      cursor: pointer;
    }

    body > img {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .playlist:not([hidden]) {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      outline: none;
    }

    .playlist iframe,
    .playlist img {
      width: min(90vw, 135vh);
    }

    .playlist iframe {
      aspect-ratio: 16 / 9;
      min-height: 200px;
      border: 0;
    }

    .playlist img {
      max-height: 90vh;
      object-fit: contain;
    }

    .overview:not([hidden]) {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      outline: none;
    }

    .overview-grid {
      --gap: clamp(8px, 2vw, 20px);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--gap);
      width: min(100%, 105vh, 1000px);
    }

    .overview button {
      display: grid;
      grid-template: minmax(0, 1fr) auto / minmax(0, 1fr);
      width: calc((100% - 2 * var(--gap)) / 3);
      aspect-ratio: 4 / 5;
      border: 0;
      padding: 0;
      background: #111;
      color: #ddd;
      font: clamp(9px, 2.5vw, 14px) system-ui, sans-serif;
      cursor: pointer;
    }

    .overview img {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
    }

    .overview button span {
      padding: 5px 2px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <img id="plaspoelpolder" src="PLASPOELPOLDER.png" alt="Plaspoelpolder" draggable="false">
  <img id="animus" src="ANIMUS.jpg" alt="Animus" draggable="false" hidden>
  <img id="ptp" src="PTP.jpg" alt="PTP" draggable="false" hidden>
  <img id="une" src="UNBORN.jpg" alt="UNBORN" draggable="false" hidden>
  <section id="ptp-prop" class="playlist" aria-label="PTP Prop-afspeellijst" tabindex="-1" hidden>
    <iframe title="PTP Prop op YouTube"
      data-src="https://www.youtube.com/embed?listType=playlist&amp;list=PLidK2zBv6eFztFiyVYsgMUf7mD4pBHCUO"
      referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <img src="PTP%20PROP.png" alt="PTP PROP" draggable="false" hidden>
  </section>
  <section class="overview" aria-label="Overzicht van de dia’s" tabindex="-1" hidden>
    <div class="overview-grid">
      <button type="button" data-target="plaspoelpolder">
        <img src="PLASPOELPOLDER.png" alt="" draggable="false">
        <span>PLASPOELPOLDER</span>
      </button>
      <button type="button" data-target="animus">
        <img src="ANIMUS.jpg" alt="" draggable="false">
        <span>ANIMUS</span>
      </button>
      <button type="button" data-target="ptp">
        <img src="PTP.jpg" alt="" draggable="false">
        <span>PTP</span>
      </button>
      <button type="button" data-target="une">
        <img src="UNBORN.jpg" alt="" draggable="false">
        <span>UNBORN</span>
      </button>
      <button type="button" data-target="ptp-prop" aria-label="PTP PROP op YouTube">
        <img src="PTP%20PROP.png" alt="" draggable="false">
        <span>PTP PROP</span>
      </button>
    </div>
  </section>
  <script>
    const slides = Array.from(document.querySelectorAll('body > img, .playlist, .overview'));
    const playlist = document.querySelector('.playlist');
    const overview = document.querySelector('.overview');
    const player = playlist.querySelector('iframe');
    let current = 0;

    // A local file cannot send the referrer that the YouTube player requires.
    player.hidden = location.protocol === 'file:';
    playlist.querySelector('img').hidden = !player.hidden;

    function showSlide(index) {
      const previous = slides[current];
      previous.hidden = true;
      if (previous === playlist) player.removeAttribute('src');

      current = index;
      const next = slides[current];
      next.hidden = false;
      if (next === playlist && !player.hidden) player.src = player.dataset.src;
      if (next === playlist || next === overview) next.focus({ preventScroll: true });
    }

    function changeSlide(step) {
      showSlide((current + step + slides.length) % slides.length);
    }

    player.addEventListener('pointerleave', () => {
      if (document.activeElement === player) playlist.focus({ preventScroll: true });
    });

    document.addEventListener('click', (event) => {
      const tile = event.target.closest('.overview button');
      if (tile) {
        showSlide(slides.findIndex(slide => slide.id === tile.dataset.target));
      } else {
        changeSlide(1);
      }

      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        changeSlide(event.key === 'ArrowLeft' ? -1 : 1);
      }
    });
  </script>
</body>
</html>
