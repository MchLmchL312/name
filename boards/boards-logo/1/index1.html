<!doctype html>
<html lang="nl">
<head>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" href="/favicon_MchL.png?v=2" type="image/png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Machiel van Soest — Emblem</title>
  <style>
    :root{
      --maxw: 1100px;
      --pad: 18px;
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --bg: #0c0c0f;
    }

    *{ box-sizing:border-box; }
    html, body{
       height:100%; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(255,255,255,.06), transparent 60%),
                  radial-gradient(900px 500px at 80% 10%, rgba(255,255,255,.05), transparent 55%),
                  var(--bg);
      color: var(--text);
    }

    header{
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(12,12,15,.65);
      border-bottom: 1px solid var(--border);
    }

    .wrap{
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 var(--pad);
      width: 100%;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 16px;
      padding: 14px 0;
    }

    .brand{
      display:flex;
      flex-direction:column;
      line-height:1.1;
    }
    .brand .name{
      font-weight: 650;
      letter-spacing: .2px;
    }
    .brand .sub{
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    nav{
      display:flex;
      gap: 14px;
      align-items:center;
      flex-wrap: wrap;
    }
    nav a{
      color: var(--text);
      text-decoration:none;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
    }
    nav a:hover{
      border-color: var(--border);
      background: rgba(255,255,255,.04);
    }

    /* Main vult scherm onder header */
    main{
      flex: 1;
      display:flex;
      padding: 14px 0;
      min-height: 0;
    }
    main > .wrap{
      flex:1;
      display:flex;
      min-height:0;
    }

    /* Carousel */
    .carousel{
      flex: 1;
      display:flex;
      flex-direction:column;
      min-height: 0;

      position: relative;
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255,255,255,.03);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      user-select: none;
    }

    .stage{
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      background: rgba(0,0,0,.25);
    }

    .stage img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: contain; /* altijd schalen naar het schermvlak, zonder afsnijden */
      opacity: 0;
      transform: scale(1.01);
      transition: opacity 650ms ease, transform 900ms ease;
    }
    .stage img.is-active{
      opacity: 1;
      transform: scale(1.0);
    }

    .controls{
      position:absolute;
      inset: 0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 10px;
      pointer-events:none;
    }

    .btn{
      pointer-events:auto;
      border: 1px solid var(--border);
      background: rgba(12,12,15,.55);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 999px;
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform 120ms ease, background 120ms ease;
    }
    .btn:hover{ background: rgba(12,12,15,.75); transform: translateY(-1px); }
    .btn:active{ transform: translateY(0px); }

    .meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      background: rgba(12,12,15,.35);
    }

    .label{
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .2px;
      white-space: nowrap;
      user-select: none;
    }

    .dots{
      display:flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content:space-between;
    }
    .dot{
      width: 7px;
      height: 7px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.25);
      background: transparent;
      padding: 0;
      cursor:pointer;
    }
    .dot.is-active{
      background: rgba(255,255,255,.75);
      border-color: rgba(255,255,255,.55);
    }

    @media (max-width: 720px){
      .topbar{ align-items:flex-start; }
      .dots{ justify-content:flex-start; }
    }
  
    .modebtn{
      border: 1px solid var(--border);
      background: rgba(12,12,15,.35);
      color: var(--text);
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
      white-space: nowrap;
    }
    .modebtn:hover{ background: rgba(12,12,15,.55); transform: translateY(-1px); }
    .modebtn:active{ transform: translateY(0px); }

    .hidden{ display:none !important; }

    body.noscroll{ overflow: hidden; }

    /* Thumbnail grid */
    .thumbs{
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      grid-auto-rows: 150px;
      gap: 10px;
      align-content: start;
      background: rgba(0,0,0,.20);
    }
    .thumb{
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      cursor: pointer;
      height: 100%;
    }
    .thumb img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      transform: scale(1.02);
      transition: transform 220ms ease;
    }
    .thumb:hover img{ transform: scale(1.06); }

    /* Lightbox */
    .lightbox{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: grid;
      place-items: center;
      padding: 18px;
      z-index: 999;
    }
    .lightbox img{
      width: auto;
      height: auto;
      max-width: calc(100vw - 36px);
      max-height: calc(100vh - 36px);
      object-fit: contain;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(12,12,15,.35);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      cursor: pointer;
    }

    @media (max-width: 720px){
      .thumbs{ grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    }

  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <div class="name">Machiel van Soest</div>
          <div class="sub">Emblem</div>
        </div>
        <nav aria-label="Hoofdnavigatie">
                    <a href="index.html">Home</a>        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="carousel" aria-label="Afbeeldingen">
        <div class="thumbs" id="thumbs" aria-label="Miniaturen"></div>
        <div class="lightbox hidden" id="lightbox" aria-label="Grote weergave">
          <img id="lightboxImg" alt="Grote weergave" />
        </div>
      </section>
    </div>
  </main>

<script>
  // ===== Instellingen =====
  const IMAGE_MAX = 44;           // maximum waar hij tot mag proberen
  const STOP_AFTER_MISSES = 2;    // stop na X opeenvolgende missers (meestal genoeg als je reeks netjes 1..n is)

  const thumbs = document.getElementById('thumbs');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');

  function openLightbox(src, i){
    lightboxImg.src = src;
    lightboxImg.alt = `Flag ${i}`;
    lightbox.classList.remove('hidden');
    document.body.classList.add('noscroll');
  }

  function closeLightbox(){
    lightbox.classList.add('hidden');
    document.body.classList.remove('noscroll');
  }

  function addThumb(src, i){
    const item = document.createElement('div');
    item.className = 'thumb';
    item.setAttribute('role', 'button');
    item.setAttribute('tabindex', '0');
    item.setAttribute('aria-label', `Open afbeelding ${i}`);

    const im = new Image();
    im.src = src;
    im.alt = `Flag ${i}`;
    im.loading = "lazy";
    item.appendChild(im);

    const open = () => openLightbox(src, i);
    item.addEventListener('click', open);
    item.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') open();
    });

    thumbs.appendChild(item);
  }

  // Probeert sequentieel te laden; alleen succesvolle loads worden toegevoegd.
  async function loadThumbs(){
    let misses = 0;

    for (let i = 1; i <= IMAGE_MAX; i++){
      const src = encodeURI(`image (${i}).jpg`);

      const exists = await new Promise((resolve) => {
        const probe = new Image();
        probe.onload = () => resolve(true);
        probe.onerror = () => resolve(false);
        probe.src = src;
      });

      if (!exists){
        misses++;
        if (misses >= STOP_AFTER_MISSES) break;
        continue;
      }

      misses = 0;
      addThumb(src, i);
    }
  }

  loadThumbs();

  // Klik op groot beeld -> sluiten
  lightboxImg.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  // ESC sluit
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) closeLightbox();
  });
</script>

</body>
</html>
