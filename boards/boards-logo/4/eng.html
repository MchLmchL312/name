<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" href="/favicon_MchL.png?v=2" type="image/png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Machiel van Soest — Visceral (EN)</title>
  <style>
    :root{
      --maxw: 1100px;
      --pad: 18px;
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --bg: #0c0c0f;
      --card: rgba(255,255,255,.03);
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(255,255,255,.06), transparent 60%),
                  radial-gradient(900px 500px at 80% 10%, rgba(255,255,255,.05), transparent 55%),
                  var(--bg);
      color: var(--text);
    }

    header{
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(12,12,15,.65);
      border-bottom: 1px solid var(--border);
    }

    .wrap{
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 var(--pad);
      width: 100%;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 16px;
      padding: 14px 0;
    }

    .brand{
      display:flex;
      flex-direction:column;
      line-height:1.1;
    }
    .brand .name{
      font-weight: 650;
      letter-spacing: .2px;
    }
    .brand .sub{
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    nav{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
    }
    nav a{
      color: var(--text);
      text-decoration:none;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
    }
    nav a:hover{
      border-color: var(--border);
      background: rgba(255,255,255,.04);
    }
    nav a.active{
      border-color: rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
    }

    main{
      flex: 1;
      padding: 18px 0 40px;
    }

    .card{
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      overflow: hidden;
    }

    .intro{
      padding: 18px 18px 6px;
      border-bottom: 1px solid var(--border);
      background: rgba(12,12,15,.25);
    }
    .intro h1{
      margin:0 0 8px;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: .2px;
    }
    .intro p{
      margin:0 0 12px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 80ch;
    }

    .content{
      padding: 8px 18px 18px;
    }

    .section{
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .section:last-child{ border-bottom: 0; }

    h2{
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: .2px;
    }

    p{
      margin: 0 0 10px;
      color: rgba(255,255,255,.80);
      line-height: 1.65;
    }
    p:last-child{ margin-bottom: 0; }

    @media (max-width: 720px){
      .topbar{ align-items:flex-start; }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <div class="name">Machiel van Soest</div>
          <div class="sub">Visceral</div>
        </div>

        <nav aria-label="Navigation">
          <a href="index.html">Home</a>
          <a href="nl.html">NL</a>
          <a class="active" href="eng.html">EN</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <article class="card">
        <div class="intro">
          <h1>Visceral — EN</h1>
          <p>Text accompanying the series Visceral.</p>
        </div>

        <div class="content">
        
                
          <div id="textContent" class="section">
            <p style="color: var(--muted); margin: 0;">Loading text…</p>
          </div>
        
        

        </div>
      </article>
    </div>
  </main>

  <script>
    (async () => {
      const target = document.getElementById('textContent');
      const url = encodeURI('board1 - eng.txt');
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const txt = await res.text();
        const trimmed = txt.trim();
        const looksHTML = /<\s*(section|h1|h2|h3|p|div|article|ul|ol|br|strong|em)\b/i.test(trimmed);
        if (looksHTML) {
          target.innerHTML = trimmed;
        } else {
          const esc = (s) => s.replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
          target.innerHTML = `<pre style="white-space: pre-wrap; margin: 0; color: rgba(255,255,255,.80); line-height: 1.65;">${esc(trimmed)}</pre>`;
        }
      } catch (err) {
        target.innerHTML = `<p style="color: var(--muted);">Could not load text file: <code>${String(err)}</code></p>`;
      }
    })();
  </script>

</body>
</html>
