<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Archive 1990–2020 | Machiel van Soest</title>
  <meta name="description" content="Het beeldarchief van Machiel van Soest, 1990–2020. Verken de hoofdstukken met de navigatie van de hoofdwebsite binnen handbereik.">
  <link rel="canonical" href="https://www.machielvansoest.nl/boards/archive.html">
  <link rel="icon" href="../favicon.ico?v=3" sizes="any">
  <link rel="icon" href="../favicon_MchL.png?v=3" type="image/png">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #000;
    }

    :root{
      --maxw: 1200px;
      --pad: clamp(10px, 3vw, 18px);
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
    }

    *{
      box-sizing: border-box;
    }

    .header{
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      background: rgba(12,12,15,.78);
      border-bottom: 1px solid var(--border);
    }

    .wrap{
      width: 100%;
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 var(--pad);
    }

    .topbar{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 14px 0;
    }

    .brand{
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      flex: 1 1 180px;
      min-width: 0;
      color: inherit;
      text-decoration: none;
    }

    .brand .name{
      display: block;
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: .2px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand .sub{
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    nav{
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1 1 180px;
      min-width: 0;
    }

    nav a,
    nav summary{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    nav a:hover,
    nav a:focus-visible,
    nav summary:hover,
    nav summary:focus-visible{
      border-color: var(--border);
      background: rgba(255,255,255,.04);
      outline: none;
    }

    nav a.active{
      color: #ffe45c;
      border-color: rgba(255,228,92,.72);
      background: rgba(255,228,92,.12);
      font-weight: 650;
    }

    nav a.plus-link{
      font-size: 24px;
      line-height: 1;
      padding: 6px 12px 8px;
    }

    nav summary{
      cursor: pointer;
      list-style: none;
    }

    nav summary::-webkit-details-marker{
      display: none;
    }

    nav .icon-link{
      padding: 8px 10px;
    }

    nav .icon-link svg{
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      stroke: currentColor;
    }

    .contact-popover{
      position: relative;
      display: inline-flex;
    }

    .contact-card{
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      z-index: 1200;
      width: min(380px, calc(100vw - 28px));
      padding: 14px 16px;
      color: var(--text);
      background: rgba(12,12,15,.96);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
      font-size: 14px;
      line-height: 1.45;
      text-align: left;
      white-space: normal;
    }

    .contact-card p{
      margin: 0 0 10px;
    }

    .contact-card a{
      display: inline;
      min-height: auto;
      padding: 0;
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 4px;
      border: 0;
      border-radius: 0;
    }

    .contact-card a:hover,
    .contact-card a:focus-visible{
      color: #ffe45c;
      background: transparent;
      border-color: transparent;
    }

    @media (max-width: 720px){
      .topbar{
        align-items: flex-start;
        gap: 10px;
      }

      nav{
        justify-content: flex-start;
      }

      .contact-card{
        right: auto;
        left: 0;
      }
    }

    @media (max-width: 360px){
      .brand,
      nav{
        flex-basis: 100%;
      }
    }


    html { height:100%; }
    body {
      height:100vh;
      height:100dvh;
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
      overflow:hidden;
    }
    .archive-content { min-width:0; min-height:0; background:#f3f1eb; }
    .archive-frame { display:block; width:100%; height:100%; border:0; }
    .contact-card { right:0; left:auto; }
    a:focus-visible, summary:focus-visible { outline:2px solid #ffe45c; outline-offset:3px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="wrap">
      <div class="topbar">
        <a class="brand" href="../" aria-label="Machiel van Soest homepage">
          <h1 class="name">Machiel van Soest</h1>
          <div class="sub">Archive</div>
        </a>

        <nav aria-label="Navigatie">
          <a href="index.html">Boards</a>
          <a href="../PTP/index.html">PTP</a>
          <a class="active" href="archive.html" aria-current="page">Archive</a>
          <a class="plus-link" href="index-links.html" aria-label="Links">+</a>
          <details class="contact-popover">
            <summary class="icon-link" aria-label="Contact">
              <svg xmlns="http://www.w3.org/2000/svg"
                   viewBox="0 0 24 24" fill="none" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0
                1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2
                2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </summary>
            <div class="contact-card">
              <p>Machiel van Soest is beeldend kunstenaar. Deze website is een open archief van beelden, onderzoek en werk in ontwikkeling.</p>
              <a href="mailto:machielvansoest@outlook.com">machielvansoest@outlook.com</a>
            </div>
          </details>
        </nav>
      </div>
    </div>
  </header>
  <main class="archive-content" aria-label="Archief 1990–2020">
    <iframe class="archive-frame" src="https://archief-1990.pages.dev/" title="Beeldarchief van Machiel van Soest, 1990–2020"></iframe>
  </main>
</body>
</html>
