  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    :root{
      --maxw: 1200px;
      --pad: clamp(10px, 3vw, 18px);
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
    }

    *{
      box-sizing: border-box;
    }

    .header{
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      background: rgba(12,12,15,.78);
      border-bottom: 1px solid var(--border);
    }

    .wrap{
      width: 100%;
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 var(--pad);
    }

    .topbar{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 14px 0;
    }

    .brand{
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      flex: 1 1 180px;
      min-width: 0;
      color: inherit;
      text-decoration: none;
    }

    .brand .name{
      display: block;
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: .2px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand .sub{
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    nav{
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1 1 180px;
      min-width: 0;
    }

    nav a,
    nav summary{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    nav a:hover,
    nav a:focus-visible,
    nav summary:hover,
    nav summary:focus-visible{
      border-color: var(--border);
      background: rgba(255,255,255,.04);
      outline: none;
    }

    nav a.active{
      color: #ffe45c;
      border-color: rgba(255,228,92,.72);
      background: rgba(255,228,92,.12);
      font-weight: 650;
    }

    nav a.plus-link{
      font-size: 24px;
      line-height: 1;
      padding: 6px 12px 8px;
    }

    nav summary{
      cursor: pointer;
      list-style: none;
    }

    nav summary::-webkit-details-marker{
      display: none;
    }

    nav .icon-link{
      padding: 8px 10px;
    }

    nav .icon-link svg{
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      stroke: currentColor;
    }

    .contact-popover{
      position: relative;
      display: inline-flex;
    }

    .contact-card{
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      z-index: 1200;
      width: min(380px, calc(100vw - 28px));
      padding: 14px 16px;
      color: var(--text);
      background: rgba(12,12,15,.96);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
      font-size: 14px;
      line-height: 1.45;
      text-align: left;
      white-space: normal;
    }

    .contact-card p{
      margin: 0 0 10px;
    }

    .contact-card a{
      display: inline;
      min-height: auto;
      padding: 0;
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 4px;
      border: 0;
      border-radius: 0;
    }

    .contact-card a:hover,
    .contact-card a:focus-visible{
      color: #ffe45c;
      background: transparent;
      border-color: transparent;
    }

    @media (max-width: 720px){
      .topbar{
        align-items: flex-start;
        gap: 10px;
      }

      nav{
        justify-content: flex-start;
      }

      .contact-card{
        right: auto;
        left: 0;
      }
    }

    @media (max-width: 360px){
      .brand,
      nav{
        flex-basis: 100%;
      }
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
    }

    .gallery img {
      width: 100%;
      height: auto;
      cursor: pointer;
      object-fit: cover;
      border: 2px solid #000;
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.02);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0,0,0,0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 1500;
      cursor: pointer;
    }

    .overlay.show {
      visibility: visible;
      opacity: 1;
    }

    .overlay img {
      max-width: 100%;
      max-height: 100%;
      pointer-events: none;
    }

  </style>

<body>
  <header class="header">
    <div class="wrap">
      <div class="topbar">
        <a class="brand" href="../" aria-label="Machiel van Soest homepage">
          <h1 class="name">Machiel van Soest</h1>
          <div class="sub">Boards</div>
        </a>

        <nav aria-label="Navigatie">
          <a class="active" href="index.html" aria-current="page">Boards</a>
          <a href="../PTP/index.html">PTP</a>
          <a class="plus-link" href="index-links.html" aria-label="Links">+</a>
          <details class="contact-popover">
            <summary class="icon-link" aria-label="Contact">
              <svg xmlns="http://www.w3.org/2000/svg"
                   viewBox="0 0 24 24" fill="none" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">

                1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2
                2-2z"></path>

              <a href="mailto:machielvansoest@outlook.com">machielvansoest@outlook.com</a>
            </div>

      </div>

  <div class="gallery" id="gallery"></div>

  <div class="overlay" id="overlay">
    <img src="" alt="Grote weergave van board" id="fullscreenImg">
  </div>

  <script>
    // Sneller dynamisch laden: we laden in kleine batches parallel en stoppen bij het eerste ontbrekende nummer.
    // Verwacht: /boards/board1.jpg, board2.jpg, board3.jpg, ... (opvolgend).
    const BOARDS_DIR = 'boards';
    const PREFIX = 'board';
    const EXT = '.jpg';

    // Veiligheidslimiet
    const MAX_SCAN = 500;

    // Hoeveel tegelijk laden (parallel) voor snelheid
    const BATCH_SIZE = 8;

    // Optioneel: voeg ?nocache toe aan de URL als je bestaande bestanden hebt vervangen
    // (bijv. http://localhost/index.html?nocache)
    const NO_CACHE = new URLSearchParams(location.search).has('nocache');
    const BUST = NO_CACHE ? `?v=${Date.now()}` : '';

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function boardUrl(n) {
      return `${BOARDS_DIR}/${PREFIX}${n}${EXT}${BUST}`;
    }

    function loadImage(n) {
      const url = boardUrl(n);
      return new Promise(resolve => {
        const img = new Image();
        img.alt = `Board ${n} van Machiel van Soest`;
        img.onload = () => resolve({ n, ok: true, img });
        img.onerror = () => resolve({ n, ok: false, img: null });
        img.src = url;
      });
    }

    function insertRandom(galleryEl, imgEl) {
      const count = galleryEl.children.length;
      if (count === 0) {
        galleryEl.appendChild(imgEl);
        return;
      }
      const pos = randInt(0, count);
      galleryEl.insertBefore(imgEl, galleryEl.children[pos] || null);
    }

    (async function initGallery() {
      const gallery = document.getElementById('gallery');
      const overlay = document.getElementById('overlay');
      const fullscreenImg = document.getElementById('fullscreenImg');
      let currentOverlayIndex = 0;

      // klein laadbericht
      const loadingMsg = document.createElement('div');
      loadingMsg.style.color = '#fff';
      loadingMsg.style.padding = '20px';
      loadingMsg.textContent = 'Boards laden…';
      loadingMsg.textContent = 'Boards laden...';
      gallery.appendChild(loadingMsg);

      let foundAny = false;
      let n = 1;
      let stop = false;

      while (n <= MAX_SCAN && !stop) {
        const batchNums = Array.from({ length: BATCH_SIZE }, (_, i) => n + i);
        const results = await Promise.all(batchNums.map(loadImage));
        results.sort((a, b) => a.n - b.n);

        for (const r of results) {
          if (!r.ok) {
            stop = true;
            break;
          }

          if (!foundAny) {
            // verwijder laadbericht zodra de eerste binnen is
            gallery.innerHTML = '';
            foundAny = true;
          }
          insertRandom(gallery, r.img);
        }

        n += BATCH_SIZE;
      }

      if (!foundAny) {
        gallery.innerHTML = '';
        const msg = document.createElement('div');
        msg.style.color = '#fff';
        msg.style.padding = '20px';
        msg.textContent = 'Geen boards gevonden in /boards (verwacht: board1.jpg, board2.jpg, …).';
        msg.textContent = 'Geen boards gevonden in /boards (verwacht: board1.jpg, board2.jpg, ...).';
        gallery.appendChild(msg);
        return;
      }

      // Overlay functionaliteit
      function galleryImages() {
        return Array.from(gallery.querySelectorAll('img'));
      }

      function showOverlayAt(index) {
        const images = galleryImages();
        if (!images.length) return;

        currentOverlayIndex = (index + images.length) % images.length;
        fullscreenImg.src = images[currentOverlayIndex].src;
        overlay.classList.add('show');
      }

      function moveOverlay(direction) {
        showOverlayAt(currentOverlayIndex + direction);
      }

      function closeOverlay() {
        overlay.classList.remove('show');
        fullscreenImg.src = '';
      }

      gallery.addEventListener('click', e => {
        if (e.target && e.target.tagName === 'IMG') {
          showOverlayAt(galleryImages().indexOf(e.target));
        }
      });

      overlay.addEventListener('click', e => {
        const zone = e.clientX / window.innerWidth;

        if (zone < 0.33) {
          moveOverlay(-1);
        } else if (zone > 0.66) {
          moveOverlay(1);
        } else {
          closeOverlay();
        }
      });

      document.addEventListener('keydown', e => {
        if (!overlay.classList.contains('show')) return;

        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          moveOverlay(-1);
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          moveOverlay(1);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          closeOverlay();
        }
      });
    })();
  </script>

</body>
