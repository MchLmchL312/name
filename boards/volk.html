<!doctype html>
<html lang="nl">
<head>
  <link rel="icon" href="/favicon_MchL.jpg" type="image/jpeg">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube embed – zwarte achtergrond</title>
  <style>
    /* Zwarte achtergrond */
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }
    /* Video gecentreerd en responsief 16:9 */
    .wrap {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 0 1rem;
      box-sizing: border-box;
    }
    .video {
      width: min(100%, 960px);
      aspect-ratio: 16 / 9;
    }
    .video iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="video">
      <iframe
        src="https://www.youtube.com/embed/KqQs03dvpEU"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
  </div>
</body>
</html>
