  <title>Woord-flits — strak</title>
  <style>
    :root { --word-duration: 220ms; }

    html, body { height: 100%; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .stage {
      position: relative;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5vmin;
      box-sizing: border-box;
      cursor: none;
    }
    #word {
      /* Strak: geen animaties of transforms */
      transition: none;
      opacity: 1;
      transform: none;

      font-weight: 600;
      line-height: 1.15;
      letter-spacing: .01em;
      font-size: clamp(28px, 10vw, 120px);
      /* voorkom kleine verschuivingen door ligaturen/hinting */
      font-variant-ligatures: none;
      text-rendering: geometricPrecision;

      /* Houd ruimte stabiel zodat niets “stuitert” */
      display: inline-block;
      min-height: 1em; /* reserveer hoogte van één regel */
      text-wrap: balance;
    }
    /* Geen afterglow */
    #word::after { content: none; }

    #hint {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: #aaa;
      font-size: 13px;
      letter-spacing: .02em;
      opacity: .7;
      user-select: none;
    }
    #hint.hidden { display: none; }
  </style>
</head>

  <script>
    // URL-parameter ?speed=... (ms per woord)
    function getSpeedFromURL(defaultMs) {
      const params = new URLSearchParams(window.location.search);
      const s = parseInt(params.get("speed"), 10);
      return Number.isFinite(s) && s > 0 ? s : defaultMs;
    }

    const DURATION = getSpeedFromURL(220);
    const source = document.getElementById('source').textContent.trim();
    const words = source.match(/\S+/g) || [];
    const wordEl = document.getElementById('word');
    const hintEl = document.getElementById('hint');

    let i = 0;
    let paused = false;
    let intervalId = null;

    function tick() {
      // direct, zonder animatie
      wordEl.textContent = words[i] || '';
      i = (i + 1) % words.length;
    }

    function start() {
      clearInterval(intervalId);
      paused = false;
      tick();
      intervalId = setInterval(tick, DURATION);
    }

    function pause() {
      paused = true;
      clearInterval(intervalId);
    }

    function togglePause() {
      if (paused) start(); else pause();
    }

    // Controls
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); togglePause(); hintEl.classList.add('hidden'); }
      if (e.key.toLowerCase() === 'f') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else document.exitFullscreen().catch(()=>{});
      }
    });
    document.getElementById('stage').addEventListener('pointerdown', () => {
      togglePause();
      hintEl.classList.add('hidden');
    });

    // Start meteen
    start();
  </script>
