<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12161b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Grijswaarde" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Grijswaarde-meter</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  :root {
    color-scheme: dark;
    --bg: #111418;
    --surface: #181d23;
    --surface-2: #20262e;
    --surface-3: #27303a;
    --text: #f2f5f7;
    --muted: #a8b2bd;
    --line: #333d48;
    --accent: #3db4a8;
    --accent-2: #c6e36d;
    --danger: #ff6f61;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  html,
  body {
    min-height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    letter-spacing: 0;
  }

  body {
    min-width: 320px;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  button,
  label.button {
    min-width: 0;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 0 14px;
    background: var(--accent);
    color: #061716;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }

  button.secondary,
  label.secondary {
    background: var(--surface-3);
    color: var(--text);
  }

  button:disabled {
    opacity: 0.48;
    cursor: not-allowed;
  }

  button:active,
  label.button:active { transform: translateY(1px); }

  button:disabled:active { transform: none; }

  input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .app {
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    display: grid;
    gap: 12px;
    padding: 12px;
    border-bottom: 1px solid var(--line);
    background: rgba(17, 20, 24, 0.96);
    backdrop-filter: blur(12px);
  }

  .titleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.1;
    font-weight: 750;
  }

  .actions {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
  }

  .radiusControl {
    display: grid;
    grid-template-columns: auto minmax(120px, 1fr) 54px;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .radiusValue {
    color: var(--text);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  main {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
  }

  .stage {
    min-width: 0;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    background-color: #0f1216;
    background-image:
      linear-gradient(45deg, rgba(255, 255, 255, 0.035) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255, 255, 255, 0.035) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.035) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.035) 75%);
    background-size: 28px 28px;
    background-position: 0 0, 0 14px, 14px -14px, -14px 0;
  }

  .emptyState {
    width: min(520px, 100%);
    display: grid;
    gap: 16px;
    justify-items: center;
    padding: 28px 18px;
    border: 1px dashed #526171;
    border-radius: 8px;
    background: rgba(24, 29, 35, 0.92);
    box-shadow: 0 18px 50px var(--shadow);
    text-align: center;
  }

  .emptyState strong {
    display: block;
    font-size: 22px;
    font-weight: 760;
  }

  .emptyState .emptyActions {
    width: min(360px, 100%);
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .canvasWrap {
    position: relative;
    display: none;
    max-width: 100%;
    max-height: 100%;
  }

  .cameraVideo {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  canvas {
    display: block;
    width: auto;
    height: auto;
    max-width: calc(100vw - 368px);
    max-height: calc(100dvh - 102px);
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #080a0d;
    cursor: crosshair;
    touch-action: none;
    user-select: none;
  }

  .probe {
    position: absolute;
    display: none;
    z-index: 3;
    border: 2px solid #ffffff;
    border-radius: 50%;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.92),
      inset 0 0 0 1px rgba(0, 0, 0, 0.92);
    pointer-events: none;
    transform: translate(-50%, -50%);
  }

  .probeStick {
    position: absolute;
    z-index: 2;
    display: none;
    height: 2px;
    background: #ffffff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.82);
    pointer-events: none;
    transform-origin: 0 50%;
  }

  .touchPoint {
    position: absolute;
    z-index: 2;
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid #ffffff;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.42);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.82);
    pointer-events: none;
    transform: translate(-50%, -50%);
  }

  aside {
    min-width: 0;
    padding: 16px;
    border-left: 1px solid var(--line);
    background: var(--surface);
    overflow: auto;
  }

  .readout {
    display: grid;
    gap: 12px;
  }

  .panel {
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
  }

  .label {
    margin-bottom: 7px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 650;
  }

  .percent {
    display: flex;
    align-items: baseline;
    gap: 4px;
    font-size: 54px;
    line-height: 0.95;
    font-weight: 780;
    font-variant-numeric: tabular-nums;
  }

  .percent small {
    color: var(--muted);
    font-size: 24px;
    font-weight: 700;
  }

  .toneBar {
    position: relative;
    height: 24px;
    border: 1px solid #080a0d;
    border-radius: 5px;
    background: linear-gradient(90deg, #000000, #ffffff);
    overflow: hidden;
  }

  .toneMarker {
    position: absolute;
    left: 50%;
    top: 0;
    width: 3px;
    height: 100%;
    background: var(--danger);
    transform: translateX(-50%);
  }

  .swatch {
    height: 74px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #808080;
  }

  .meta {
    display: grid;
    gap: 8px;
    color: var(--muted);
    font-size: 14px;
  }

  .meta div {
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }

  .meta b {
    min-width: 0;
    color: var(--text);
    font-weight: 650;
    text-align: right;
    overflow-wrap: anywhere;
  }

  .error {
    display: none;
    padding: 10px 12px;
    border: 1px solid rgba(255, 111, 97, 0.35);
    border-radius: 8px;
    background: rgba(255, 111, 97, 0.1);
    color: #ffb0a8;
    font-size: 14px;
  }

  @media (max-width: 880px) {
    .app { display: block; }

    header {
      position: static;
      padding: 11px;
    }

    .titleRow {
      min-height: 38px;
    }

    .actions {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    main {
      display: flex;
      min-height: auto;
      flex-direction: column;
    }

    .stage {
      min-height: 48dvh;
      padding: 10px;
    }

    canvas {
      max-width: calc(100vw - 20px - env(safe-area-inset-left) - env(safe-area-inset-right));
      max-height: 54dvh;
    }

    aside {
      border-left: 0;
      border-top: 1px solid var(--line);
      overflow: visible;
      padding: 10px;
    }

    .readout {
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .panel.primary,
    .panel.full {
      grid-column: 1 / -1;
    }

    .percent { font-size: 48px; }
  }

  @media (max-width: 480px) {
    header {
      gap: 8px;
      padding: 8px;
    }

    .titleRow {
      min-height: 24px;
    }

    h1 { font-size: 19px; }

    .actions {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
    }

    button,
    label.button {
      min-height: 38px;
      padding: 0 4px;
      font-size: 12px;
    }

    .radiusControl {
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      gap: 7px;
      font-size: 13px;
    }

    .stage {
      min-height: 50dvh;
      padding: 6px;
    }

    canvas {
      max-width: calc(100vw - 12px - env(safe-area-inset-left) - env(safe-area-inset-right));
      max-height: 56dvh;
    }

    aside {
      padding: 8px;
    }

    .readout {
      gap: 8px;
    }

    .emptyState {
      padding: 22px 12px;
    }

    .emptyState strong {
      font-size: 20px;
    }

    .panel {
      padding: 9px;
    }

    .percent {
      font-size: 40px;
    }

    .swatch {
      height: 48px;
    }

    .meta {
      gap: 6px;
      font-size: 13px;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="titleRow">
        <h1>Grijswaarde-meter</h1>
      </div>
      <div class="actions">
        <label class="button" for="photoInput">Foto</label>
        <label class="button" for="cameraInput">Camera</label>
        <button class="secondary" type="button" id="liveButton" aria-pressed="false">Live</button>
        <button class="secondary" type="button" id="bwButton" aria-pressed="false" disabled>Zwart/wit</button>
        <button class="secondary" type="button" id="resetButton">Nieuw beeld</button>
        <input id="photoInput" type="file" accept="image/*" />
        <input id="cameraInput" type="file" accept="image/*" capture="environment" />
      </div>
      <label class="radiusControl" for="radiusInput">
        <span>Cirkel</span>
        <input id="radiusInput" type="range" min="3" max="90" value="24" />
        <span class="radiusValue" id="radiusLabel">24 px</span>
      </label>
    </header>

    <main>
      <section class="stage" id="stage" aria-label="Afbeelding">
        <div class="emptyState" id="emptyState">
          <strong>Kies een beeld</strong>
          <div class="emptyActions">
            <label class="button" for="photoInput">Foto</label>
            <label class="button secondary" for="cameraInput">Camera</label>
            <button class="secondary" type="button" id="liveEmptyButton">Live</button>
          </div>
        </div>
        <div class="canvasWrap" id="canvasWrap">
          <video class="cameraVideo" id="cameraVideo" playsinline muted></video>
          <canvas id="canvas"></canvas>
          <div class="probeStick" id="probeStick"></div>
          <div class="touchPoint" id="touchPoint"></div>
          <div class="probe" id="probe"></div>
        </div>
      </section>

      <aside>
        <div class="readout">
          <div class="panel primary">
            <div class="label">Grijswaarde</div>
            <div class="percent"><span id="grayPercent">--</span><small>%</small></div>
          </div>

          <div class="panel full">
            <div class="label">Toonschaal</div>
            <div class="toneBar"><div class="toneMarker" id="toneMarker"></div></div>
          </div>

          <div class="panel">
            <div class="label">Gemiddelde kleur</div>
            <div class="swatch" id="swatch"></div>
          </div>

          <div class="panel meta">
            <div><span>RGB</span><b id="rgbValue">--</b></div>
            <div><span>HEX</span><b id="hexValue">--</b></div>
            <div><span>Pixels</span><b id="pixelCount">--</b></div>
          </div>

          <div class="error full" id="error"></div>
        </div>
      </aside>
    </main>
  </div>

<script>
(() => {
  const photoInput = document.getElementById("photoInput");
  const cameraInput = document.getElementById("cameraInput");
  const radiusInput = document.getElementById("radiusInput");
  const radiusLabel = document.getElementById("radiusLabel");
  const liveButton = document.getElementById("liveButton");
  const liveEmptyButton = document.getElementById("liveEmptyButton");
  const bwButton = document.getElementById("bwButton");
  const resetButton = document.getElementById("resetButton");
  const emptyState = document.getElementById("emptyState");
  const stage = document.getElementById("stage");
  const canvasWrap = document.getElementById("canvasWrap");
  const cameraVideo = document.getElementById("cameraVideo");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const originalCanvas = document.createElement("canvas");
  const originalCtx = originalCanvas.getContext("2d", { willReadFrequently: true });
  const probeStick = document.getElementById("probeStick");
  const touchPoint = document.getElementById("touchPoint");
  const probe = document.getElementById("probe");
  const grayPercent = document.getElementById("grayPercent");
  const toneMarker = document.getElementById("toneMarker");
  const swatch = document.getElementById("swatch");
  const rgbValue = document.getElementById("rgbValue");
  const hexValue = document.getElementById("hexValue");
  const pixelCount = document.getElementById("pixelCount");
  const error = document.getElementById("error");
  const compactControls = window.matchMedia("(max-width: 480px)");
  const TOUCH_SAMPLE_OFFSET = 76;
  const LIVE_MAX_SIDE = 720;

  let hasImage = false;
  let isMonochrome = false;
  let isLive = false;
  let liveStream = null;
  let liveFrameId = null;
  let lastPoint = null;
  let activePointerId = null;

  function setError(message) {
    error.textContent = message || "";
    error.style.display = message ? "block" : "none";
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function toHex(value) {
    return value.toString(16).padStart(2, "0").toUpperCase();
  }

  function updateRadius() {
    const radius = Number(radiusInput.value);
    radiusLabel.textContent = `${radius} px`;
    if (isLive) {
      sampleAtCenter();
      return;
    }
    if (lastPoint) sampleAt(lastPoint.clientX, lastPoint.clientY, lastPoint.guidePoint);
  }

  function updateLiveButton() {
    liveButton.textContent = isLive ? (compactControls.matches ? "Stop" : "Stop live") : "Live";
    liveButton.setAttribute("aria-pressed", String(isLive));
  }

  function updateBwButton() {
    bwButton.disabled = !hasImage;
    bwButton.textContent = isMonochrome ? "Kleur" : (compactControls.matches ? "Z/W" : "Zwart/wit");
    bwButton.setAttribute("aria-pressed", String(isMonochrome));
  }

  function updateResetButton() {
    resetButton.textContent = compactControls.matches ? "Nieuw" : "Nieuw beeld";
  }

  function updateControlLabels() {
    updateLiveButton();
    updateBwButton();
    updateResetButton();
  }

  function hideProbeGuide() {
    probeStick.style.display = "none";
    touchPoint.style.display = "none";
  }

  function setLastPointGuide(guidePoint) {
    if (!lastPoint) return;
    lastPoint.guidePoint = guidePoint;
  }

  function resetReadout() {
    grayPercent.textContent = "--";
    rgbValue.textContent = "--";
    hexValue.textContent = "--";
    pixelCount.textContent = "--";
    swatch.style.background = "#808080";
    toneMarker.style.left = "50%";
    probe.style.display = "none";
    hideProbeGuide();
    lastPoint = null;
  }

  function stopLiveCamera() {
    if (liveFrameId) {
      cancelAnimationFrame(liveFrameId);
      liveFrameId = null;
    }

    if (liveStream) {
      liveStream.getTracks().forEach((track) => track.stop());
      liveStream = null;
    }

    cameraVideo.pause();
    cameraVideo.srcObject = null;
    isLive = false;
    updateControlLabels();
  }

  function clearImage() {
    stopLiveCamera();
    hasImage = false;
    isMonochrome = false;
    activePointerId = null;
    photoInput.value = "";
    cameraInput.value = "";
    canvas.width = 1;
    canvas.height = 1;
    originalCanvas.width = 1;
    originalCanvas.height = 1;
    emptyState.style.display = "grid";
    canvasWrap.style.display = "none";
    resetReadout();
    updateControlLabels();
    setError("");
  }

  function waitForVideoReady() {
    if (cameraVideo.readyState >= 2 && cameraVideo.videoWidth > 0) {
      return Promise.resolve();
    }

    return new Promise((resolve, reject) => {
      let timeoutId = 0;

      const cleanup = () => {
        clearTimeout(timeoutId);
        cameraVideo.removeEventListener("loadedmetadata", handleReady);
        cameraVideo.removeEventListener("canplay", handleReady);
        cameraVideo.removeEventListener("error", handleError);
      };

      const handleReady = () => {
        if (cameraVideo.videoWidth <= 0) return;
        cleanup();
        resolve();
      };

      const handleError = () => {
        cleanup();
        reject(new Error("camera video error"));
      };

      timeoutId = setTimeout(() => {
        cleanup();
        reject(new Error("camera video timeout"));
      }, 5000);

      cameraVideo.addEventListener("loadedmetadata", handleReady);
      cameraVideo.addEventListener("canplay", handleReady);
      cameraVideo.addEventListener("error", handleError);
    });
  }

  function syncLiveCanvasSize() {
    const sourceWidth = cameraVideo.videoWidth || 640;
    const sourceHeight = cameraVideo.videoHeight || 480;
    const scale = Math.min(1, LIVE_MAX_SIDE / Math.max(sourceWidth, sourceHeight));
    const width = Math.max(1, Math.round(sourceWidth * scale));
    const height = Math.max(1, Math.round(sourceHeight * scale));

    if (canvas.width === width && canvas.height === height) return;

    canvas.width = width;
    canvas.height = height;
    originalCanvas.width = width;
    originalCanvas.height = height;
  }

  function applyMonochrome() {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    for (let index = 0; index < data.length; index += 4) {
      const gray = Math.round(0.2126 * data[index] + 0.7152 * data[index + 1] + 0.0722 * data[index + 2]);
      data[index] = gray;
      data[index + 1] = gray;
      data[index + 2] = gray;
    }

    ctx.putImageData(imageData, 0, 0);
  }

  function renderImage() {
    if (!hasImage) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(originalCanvas, 0, 0);
    if (isMonochrome) applyMonochrome();

    if (lastPoint) sampleAt(lastPoint.clientX, lastPoint.clientY, lastPoint.guidePoint);
  }

  function drawLiveFrame() {
    if (!isLive) return;

    if (cameraVideo.readyState >= 2 && cameraVideo.videoWidth > 0) {
      syncLiveCanvasSize();
      originalCtx.drawImage(cameraVideo, 0, 0, originalCanvas.width, originalCanvas.height);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(originalCanvas, 0, 0);
      if (isMonochrome) applyMonochrome();
      sampleAtCenter();
    }

    liveFrameId = requestAnimationFrame(drawLiveFrame);
  }

  async function startLiveCamera() {
    if (isLive) {
      stopLiveCamera();
      return;
    }

    if (!window.isSecureContext && location.protocol !== "https:") {
      setError("Live camera werkt alleen via HTTPS. Open de GitHub Pages-link of de beginscherm-app.");
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setError("Live camera wordt door deze browser niet ondersteund.");
      return;
    }

    setError("");
    let stream = null;

    try {
      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch {
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
      }

      liveStream = stream;
      cameraVideo.srcObject = stream;
      await cameraVideo.play();
      await waitForVideoReady();

      hasImage = true;
      isLive = true;
      isMonochrome = false;
      activePointerId = null;
      photoInput.value = "";
      cameraInput.value = "";
      emptyState.style.display = "none";
      canvasWrap.style.display = "block";
      resetReadout();
      updateControlLabels();
      drawLiveFrame();
    } catch {
      if (stream) stream.getTracks().forEach((track) => track.stop());
      liveStream = null;
      cameraVideo.pause();
      cameraVideo.srcObject = null;
      isLive = false;
      setError("Live camera kon niet starten. Controleer cameratoegang in Safari.");
      updateControlLabels();
    }
  }

  function drawImage(file) {
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      setError("Kies een geldig afbeeldingsbestand.");
      return;
    }

    stopLiveCamera();
    setError("");
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);

    img.onload = () => {
      const maxSide = 2200;
      let width = img.naturalWidth || img.width;
      let height = img.naturalHeight || img.height;
      const scale = Math.min(1, maxSide / Math.max(width, height));

      width = Math.max(1, Math.round(width * scale));
      height = Math.max(1, Math.round(height * scale));

      canvas.width = width;
      canvas.height = height;
      originalCanvas.width = width;
      originalCanvas.height = height;
      originalCtx.clearRect(0, 0, width, height);
      originalCtx.drawImage(img, 0, 0, width, height);

      hasImage = true;
      isMonochrome = false;
      emptyState.style.display = "none";
      canvasWrap.style.display = "block";
      resetReadout();
      updateControlLabels();
      renderImage();
      URL.revokeObjectURL(objectUrl);
    };

    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      setError("Deze afbeelding kon niet worden geladen.");
    };

    img.src = objectUrl;
  }

  function canvasPoint(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width);
    const y = (clientY - rect.top) * (canvas.height / rect.height);
    return { x, y, rect };
  }

  function updateProbeGuide(rect, displayX, displayY, guidePoint) {
    if (!guidePoint) {
      hideProbeGuide();
      return;
    }

    const startX = clamp(guidePoint.clientX - rect.left, 0, rect.width);
    const startY = clamp(guidePoint.clientY - rect.top, 0, rect.height);
    const endX = displayX - rect.left;
    const endY = displayY - rect.top;
    const dx = endX - startX;
    const dy = endY - startY;
    const distance = Math.hypot(dx, dy);

    touchPoint.style.left = `${startX}px`;
    touchPoint.style.top = `${startY}px`;
    touchPoint.style.display = "block";

    if (distance < 10) {
      probeStick.style.display = "none";
      return;
    }

    probeStick.style.left = `${startX}px`;
    probeStick.style.top = `${startY}px`;
    probeStick.style.width = `${distance}px`;
    probeStick.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
    probeStick.style.display = "block";
  }

  function sampleAt(clientX, clientY, guidePoint = null) {
    if (!hasImage) return;

    const radius = Number(radiusInput.value);
    const { x, y, rect } = canvasPoint(clientX, clientY);
    const cx = clamp(Math.round(x), 0, canvas.width - 1);
    const cy = clamp(Math.round(y), 0, canvas.height - 1);
    const left = clamp(cx - radius, 0, canvas.width - 1);
    const top = clamp(cy - radius, 0, canvas.height - 1);
    const right = clamp(cx + radius, 0, canvas.width - 1);
    const bottom = clamp(cy + radius, 0, canvas.height - 1);
    const imageData = ctx.getImageData(left, top, right - left + 1, bottom - top + 1).data;
    const radiusSquared = radius * radius;
    const sampleWidth = right - left + 1;

    let totalR = 0;
    let totalG = 0;
    let totalB = 0;
    let totalLuma = 0;
    let count = 0;

    for (let py = top; py <= bottom; py++) {
      for (let px = left; px <= right; px++) {
        const dx = px - cx;
        const dy = py - cy;
        if (dx * dx + dy * dy > radiusSquared) continue;

        const index = ((py - top) * sampleWidth + (px - left)) * 4;
        const r = imageData[index];
        const g = imageData[index + 1];
        const b = imageData[index + 2];
        const a = imageData[index + 3] / 255;
        if (a <= 0) continue;

        totalR += r * a;
        totalG += g * a;
        totalB += b * a;
        totalLuma += (0.2126 * r + 0.7152 * g + 0.0722 * b) * a;
        count += a;
      }
    }

    if (count === 0) return;

    const avgR = Math.round(totalR / count);
    const avgG = Math.round(totalG / count);
    const avgB = Math.round(totalB / count);
    const percent = Math.round((totalLuma / count / 255) * 100);
    const hex = `#${toHex(avgR)}${toHex(avgG)}${toHex(avgB)}`;

    grayPercent.textContent = String(percent);
    rgbValue.textContent = `${avgR}, ${avgG}, ${avgB}`;
    hexValue.textContent = hex;
    pixelCount.textContent = String(Math.round(count));
    swatch.style.background = hex;
    toneMarker.style.left = `${percent}%`;

    const displayX = rect.left + (cx / canvas.width) * rect.width;
    const displayY = rect.top + (cy / canvas.height) * rect.height;
    const displayRadius = radius * (rect.width / canvas.width);
    probe.style.width = `${displayRadius * 2}px`;
    probe.style.height = `${displayRadius * 2}px`;
    probe.style.left = `${displayX - rect.left}px`;
    probe.style.top = `${displayY - rect.top}px`;
    probe.style.display = "block";
    updateProbeGuide(rect, displayX, displayY, guidePoint);

    lastPoint = { clientX, clientY, guidePoint };
  }

  function sampleAtCenter() {
    if (!hasImage) return;

    const rect = canvas.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return;

    sampleAt(rect.left + rect.width / 2, rect.top + rect.height / 2);
  }

  function sampleFromPointer(event) {
    const isTouch = event.pointerType === "touch";
    const offset = isTouch ? Math.min(TOUCH_SAMPLE_OFFSET, canvas.getBoundingClientRect().height * 0.26) : 0;
    const guidePoint = isTouch ? { clientX: event.clientX, clientY: event.clientY } : null;
    sampleAt(event.clientX, event.clientY - offset, guidePoint);
  }

  function handleFileInput(event) {
    drawImage(event.target.files[0]);
  }

  photoInput.addEventListener("change", handleFileInput);
  cameraInput.addEventListener("change", handleFileInput);
  radiusInput.addEventListener("input", updateRadius);
  liveButton.addEventListener("click", startLiveCamera);
  liveEmptyButton.addEventListener("click", startLiveCamera);
  bwButton.addEventListener("click", () => {
    if (!hasImage) return;
    isMonochrome = !isMonochrome;
    updateControlLabels();
    if (!isLive) renderImage();
  });
  resetButton.addEventListener("click", clearImage);

  canvas.addEventListener("pointerdown", (event) => {
    activePointerId = event.pointerId;
    canvas.setPointerCapture(event.pointerId);
    sampleFromPointer(event);
  });

  canvas.addEventListener("pointermove", (event) => {
    if (event.pointerType === "mouse" || event.pointerId === activePointerId) {
      sampleFromPointer(event);
    }
  });

  canvas.addEventListener("pointerup", (event) => {
    if (event.pointerId === activePointerId) activePointerId = null;
    setLastPointGuide(null);
    hideProbeGuide();
  });

  canvas.addEventListener("pointercancel", () => {
    activePointerId = null;
    setLastPointGuide(null);
    hideProbeGuide();
  });

  canvas.addEventListener("pointerleave", (event) => {
    if (event.pointerType === "mouse" && activePointerId === null) {
      probe.style.display = "none";
    }
  });

  ["dragenter", "dragover"].forEach((type) => {
    stage.addEventListener(type, (event) => {
      event.preventDefault();
    });
  });

  stage.addEventListener("drop", (event) => {
    event.preventDefault();
    drawImage(event.dataTransfer.files[0]);
  });

  updateRadius();
  updateControlLabels();

  if (compactControls.addEventListener) {
    compactControls.addEventListener("change", updateControlLabels);
  } else {
    compactControls.addListener(updateControlLabels);
  }

  window.addEventListener("pagehide", stopLiveCamera);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && isLive) stopLiveCamera();
  });

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
})();
</script>
</body>
</html>
