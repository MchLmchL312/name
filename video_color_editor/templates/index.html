<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Color Editor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <main class="container">
    <h1>Interactive Video Color Editor</h1>

    <section class="panel">
      <h2>Upload Video</h2>
      <form id="upload-form">
        <input id="video-input" name="video" type="file" accept="video/mp4,video/quicktime,video/x-msvideo,video/x-matroska,video/webm" required />
        <button type="submit">Upload</button>
      </form>
      <p id="upload-info" class="status"></p>
    </section>

    <section id="preview-section" class="panel preview-panel">
      <h2>Preview (Frame-first workflow)</h2>
      <p class="status">Kies een frame met de tijd-slider, pas filters realtime toe op dat frame, en render daarna de volledige video.</p>
      <div class="frame-controls">
        <label for="frame-seek">Frame time</label>
        <input id="frame-seek" type="range" min="0" max="0" step="0.04" value="0" disabled />
        <output id="frame-time">0.00s</output>
        <button id="capture-frame-btn" type="button">Use Current Video Frame</button>
      </div>
      <div class="preview-stage">
        <video id="source-video" controls crossorigin="anonymous"></video>
        <canvas id="preview-canvas"></canvas>
      </div>
      <div class="inline-actions">
        <button id="compare-btn" type="button">Compare Original / Filtered: OFF</button>
        <button id="export-frame-btn" type="button">Export Current Frame as PNG</button>
      </div>
    </section>

    <section id="presets-section" class="panel">
      <h2>Presets <span id="active-preset">(Custom)</span></h2>
      <div id="preset-buttons" class="button-grid"></div>
    </section>

    <section id="sliders-section" class="panel">
      <h2>Sliders</h2>
      <div id="sliders" class="sliders"></div>
      <button id="reset-btn" type="button">Reset</button>
    </section>

    <section id="single-export-section" class="panel">
      <h2>Single Export</h2>
      <button id="save-mp4-btn" type="button">Save as MP4</button>
      <p id="single-export-result" class="status"></p>
    </section>

    <section id="batch-section" class="panel">
      <h2>Batch Presets</h2>
      <div id="batch-list" class="batch-list"></div>
      <button id="batch-export-btn" type="button">Export Selected Presets as MP4s</button>
      <div id="batch-status" class="status"></div>
      <ul id="batch-results"></ul>
    </section>

    <section id="status-section" class="panel">
      <h2>Status</h2>
      <p id="global-status" class="status">Ready.</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
