<!DOCTYPE html>
<html lang="nl">

<head>
  <link rel="icon" href="../favicon.ico?v=3" sizes="any">
  <link rel="icon" href="../favicon_MchL.png?v=3" type="image/png">
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kleuren Indruk</title>
    <style>
        :root {
            --bg: #0b0d10;
            --fg: #e8ecf1;
            --card: #131820;
            --accent: #6aa1ff;
            --border: #263045;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 16px 0;
            font-size: 1.25rem;
            color: var(--muted);
            font-weight: 500;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            height: 100%;
            overflow: hidden;
        }

        /* Left Panel */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .color-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px;
            border-radius: 8px;
        }

        input[type="color"] {
            border: none;
            width: 32px;
            height: 32px;
            padding: 0;
            background: none;
            cursor: pointer;
            border-radius: 4px;
            overflow: hidden;
        }

        input[type="range"] {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        .pct {
            font-variant-numeric: tabular-nums;
            font-size: 0.85rem;
            color: var(--muted);
            width: 36px;
            text-align: right;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        label {
            font-size: 0.9rem;
            color: var(--fg);
        }

        input[type="number"] {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 4px 8px;
            border-radius: 6px;
            width: 60px;
        }

        button.primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        button.primary:hover {
            opacity: 0.9;
        }

        /* Right Panel */
        .preview {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }

            body {
                overflow: auto;
                height: auto;
            }

            .preview {
                height: 400px;
            }
        }
    </style>
</head>

<body>

    <div class="layout">
        <div class="controls">
            <h1>Kleuren Indruk</h1>

            <div class="card">
                <div class="color-grid" id="colorList">
                    <!-- Javascript generates rows here -->
                </div>
            </div>

            <div class="card">
                <div class="settings-row">
                    <label>Pixelgrootte</label>
                    <input type="number" id="pixelSize" value="15" min="1" max="100">
                </div>
                <div class="settings-row">
                    <label>Kleuren mengen</label>
                    <input type="checkbox" id="mixColors">
                </div>
                <button class="primary" id="refreshBtn">Vernieuw Patroon</button>
            </div>
        </div>

        <div class="preview">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        // Config
        const DEFAULTS = [
            { c: '#ff4d4d', w: 20 },
            { c: '#ffdb4d', w: 20 },
            { c: '#4d79ff', w: 20 },
            { c: '#1a1a1a', w: 20 },
            { c: '#f0f0f0', w: 20 },
            { c: '#808080', w: 0 }
        ];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const colorList = document.getElementById('colorList');

        // State
        let colors = JSON.parse(JSON.stringify(DEFAULTS));
        let resizeObserver;
        let pendingDraw = null;

        function init() {
            // Generate UI
            colorList.innerHTML = '';
            colors.forEach((item, i) => {
                const row = document.createElement('div');
                row.className = 'color-row';
                row.innerHTML = `
                <input type="color" id="c${i}" value="${item.c}">
                <input type="range" id="w${i}" min="0" max="100" value="${item.w}">
                <span class="pct" id="p${i}">${item.w}%</span>
            `;
                colorList.appendChild(row);

                // Events
                const cInput = row.querySelector(`#c${i}`);
                const wInput = row.querySelector(`#w${i}`);
                const pSpan = row.querySelector(`#p${i}`);

                cInput.addEventListener('input', (e) => {
                    colors[i].c = e.target.value;
                    scheduleDraw();
                });
                wInput.addEventListener('input', (e) => {
                    const val = parseInt(e.target.value);
                    colors[i].w = val;
                    pSpan.textContent = val + '%';
                    scheduleDraw();
                });
            });

            // Global Settings Events
            document.getElementById('pixelSize').addEventListener('input', scheduleDraw);
            document.getElementById('mixColors').addEventListener('change', scheduleDraw);
            document.getElementById('refreshBtn').addEventListener('click', () => draw(true));

            // Resize
            resizeObserver = new ResizeObserver(() => {
                fitCanvas();
                draw(false); // redraw without reseeding if possible, but simplicity: just redraw
            });
            resizeObserver.observe(document.querySelector('.preview'));

            // Initial
            fitCanvas();
            draw(true);
        }

        function fitCanvas() {
            const parent = canvas.parentElement;
            canvas.width = parent.clientWidth;
            canvas.height = parent.clientHeight;
        }

        function scheduleDraw() {
            if (pendingDraw) cancelAnimationFrame(pendingDraw);
            pendingDraw = requestAnimationFrame(() => draw(true));
        }

        function draw(reseed) {
            // Collect active weights
            const active = colors.filter(c => c.w > 0);
            if (active.length === 0) {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }

            const totalWeight = active.reduce((sum, c) => sum + c.w, 0);
            const cumulative = [];
            let sum = 0;
            active.forEach(c => {
                sum += c.w / totalWeight;
                cumulative.push({ limit: sum, hex: c.c });
            });

            const size = Math.max(1, parseInt(document.getElementById('pixelSize').value) || 15);
            const mixing = document.getElementById('mixColors').checked;

            const w = canvas.width;
            const h = canvas.height;

            // Optimized drawing
            // We calculate rows/cols
            const cols = Math.ceil(w / size);
            const rows = Math.ceil(h / size);

            ctx.clearRect(0, 0, w, h);

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let color = pick(cumulative);
                    if (mixing) {
                        const c2 = pick(cumulative);
                        color = blend(color, c2);
                    }
                    ctx.fillStyle = color;
                    ctx.fillRect(x * size, y * size, size, size);
                }
            }
        }

        function pick(cumulative) {
            const r = Math.random();
            for (let i = 0; i < cumulative.length; i++) {
                if (r <= cumulative[i].limit) return cumulative[i].hex;
            }
            return cumulative[cumulative.length - 1].hex;
        }

        function blend(c1, c2) {
            const r1 = parseInt(c1.slice(1, 3), 16), g1 = parseInt(c1.slice(3, 5), 16), b1 = parseInt(c1.slice(5, 7), 16);
            const r2 = parseInt(c2.slice(1, 3), 16), g2 = parseInt(c2.slice(3, 5), 16), b2 = parseInt(c2.slice(5, 7), 16);
            return `rgb(${Math.round((r1 + r2) / 2)}, ${Math.round((g1 + g2) / 2)}, ${Math.round((b1 + b2) / 2)})`;
        }

        init();

    </script>
</body>

</html>
