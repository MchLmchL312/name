<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" href="/favicon_MchL.png?v=2" type="image/png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Color Editor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <main class="container">
    <h1>Interactive Video Color Editor</h1>

    <section class="panel">
      <h2>Upload Video</h2>
      <form id="upload-form">
        <input id="video-input" name="video" type="file" accept="video/mp4,video/quicktime,video/x-msvideo,video/x-matroska,video/webm" required />
        <button type="submit">Upload</button>
      </form>
      <p id="upload-info" class="status"></p>
    </section>

    <section class="panel preview-panel">
      <h2>Preview</h2>
      <div class="preview-stage">
        <video id="source-video" controls crossorigin="anonymous"></video>
        <canvas id="preview-canvas"></canvas>
      </div>
      <div class="inline-actions">
        <button id="compare-btn" type="button">Compare Original / Filtered: OFF</button>
        <button id="export-frame-btn" type="button">Export Current Frame as PNG</button>
      </div>
    </section>

    <section class="panel">
      <h2>Presets <span id="active-preset">(Custom)</span></h2>
      <div id="preset-buttons" class="button-grid"></div>
    </section>

    <section class="panel">
      <h2>Sliders</h2>
      <div id="sliders" class="sliders"></div>
      <button id="reset-btn" type="button">Reset</button>
    </section>

    <section class="panel">
      <h2>Single Export</h2>
      <button id="save-mp4-btn" type="button">Save as MP4</button>
      <p id="single-export-result" class="status"></p>
    </section>

    <section class="panel">
      <h2>Batch Presets</h2>
      <div id="batch-list" class="batch-list"></div>
      <button id="batch-export-btn" type="button">Export Selected Presets as MP4s</button>
      <div id="batch-status" class="status"></div>
      <ul id="batch-results"></ul>
    </section>

    <section class="panel">
      <h2>Status</h2>
      <p id="global-status" class="status">Ready.</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
